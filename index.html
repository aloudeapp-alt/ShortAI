<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WC 2026 — ESPRIT & CLOUN</title>
<style>
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e29;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
  --text:#e8eaf0;--text2:#7a8099;--text3:#4a5068;
  --ace:#3d8ef0;--acec:#e05c30;--gold:#c9a227;
  --green:#2ecc71;--red:#e74c3c;--orange:#e8890c;
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}

/* NAV */
nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;position:sticky;top:0;z-index:100;min-height:48px;gap:0}
.nav-logo{font-size:14px;font-weight:700;color:var(--gold);letter-spacing:.03em;white-space:nowrap;flex-shrink:0}
.nav-logo span{color:var(--text2);font-weight:400}
.nav-tabs{display:flex;margin-left:12px}
.nav-tab{padding:12px 13px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--text);border-bottom-color:var(--gold)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s;flex-shrink:0}
.sync-dot.online{background:var(--green)}
.sync-dot.syncing{background:var(--gold);animation:pulse .8s infinite}
.sync-dot.error{background:var(--red)}
.sync-label{font-size:11px;color:var(--text2);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* API STATUS BAR */
.api-bar{background:var(--bg3);border-bottom:1px solid var(--border);padding:6px 16px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text3);flex-wrap:wrap}
.api-bar a{color:var(--ace);text-decoration:none}
.api-key-input{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rs);color:var(--gold);font-size:11px;font-family:monospace;padding:3px 8px;outline:none;width:220px;letter-spacing:.03em}
.api-key-input::placeholder{color:var(--text3);font-family:inherit;letter-spacing:0}
.api-key-input:focus{border-color:var(--gold)}
.btn-xs{font-size:11px;padding:3px 10px;border-radius:var(--rs);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;font-family:inherit}
.btn-xs:hover{background:var(--bg2);color:var(--text)}
.btn-xs.active-btn{background:var(--green);border-color:var(--green);color:#0d0f14;font-weight:600}
.api-status{display:flex;align-items:center;gap:5px}
.api-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0}
.api-dot.ok{background:var(--green)}
.api-dot.err{background:var(--red)}
.api-dot.checking{background:var(--orange);animation:pulse .8s infinite}
.countdown{color:var(--text3);font-variant-numeric:tabular-nums}

/* PAGES */
.page{display:none;padding:12px 16px;max-width:920px;margin:0 auto}
.page.active{display:block}

/* FILTERS */
.filters-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.flt{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.flt:hover{border-color:var(--text2);color:var(--text)}
.flt.active{background:var(--gold);border-color:var(--gold);color:#0d0f14;font-weight:600}
.search-box{margin-left:auto;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-size:12px;outline:none;width:130px}
.search-box:focus{border-color:var(--text2)}

/* STAGE HEADER */
.stage-sep{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:16px 0 6px;border-bottom:1px solid var(--border);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.stage-sep span{color:var(--text2);font-size:10px;font-weight:400;letter-spacing:0;text-transform:none}

/* MATCH CARD */
.match-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:4px;overflow:hidden;transition:border-color .15s}
.match-card.expanded{border-color:var(--border2)}
.match-card:hover{border-color:var(--border2)}

/* DESKTOP row: num | date | vtTime | msTime | teams | pickE | pickC */
.match-row{display:grid;grid-template-columns:24px 96px 72px 72px 1fr 104px 104px;align-items:center;padding:10px 12px;cursor:pointer;gap:6px;user-select:none}
@media(max-width:640px){
  .match-row{grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:4px 8px;padding:10px 12px}
  .m-num,.m-time-vk,.m-time-ms,.m-pick-cell{display:none}
  .m-teams{grid-column:1;grid-row:1}
  .m-date{grid-column:2;grid-row:1;text-align:right}
  .m-picks-mob{display:flex!important}
}
.m-picks-mob{display:none;grid-column:1/-1;grid-row:2;gap:7px;padding:0 0 2px}
.m-num{font-size:10px;color:var(--text3);text-align:center}
.m-date-main{font-size:12px;font-weight:500;white-space:nowrap}
.m-date-sub{font-size:10px;color:var(--text2)}
.m-time-main{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.m-time-sub{font-size:10px;color:var(--text3)}
.m-teams-name{font-size:13px;font-weight:500;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.m-teams-sub{font-size:10px;color:var(--text2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-teams-sub2{font-size:10px;color:var(--text3);margin-top:1px}

/* RESULT PILL */
.res-pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.res-pill.fin{background:rgba(201,162,39,.15);color:var(--gold);border:1px solid rgba(201,162,39,.3)}
.res-pill.live{background:rgba(231,76,60,.15);color:var(--red);border:1px solid rgba(231,76,60,.3);animation:pulse .8s infinite}
.res-pill.auto{font-size:9px;padding:1px 5px;background:rgba(46,204,113,.1);color:var(--green);border:1px solid rgba(46,204,113,.2);margin-left:2px;vertical-align:middle}

/* PICK BADGE */
.m-pick-cell{display:flex;justify-content:center}
.pick-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:4px 9px;border-radius:20px;cursor:pointer;transition:all .12s;white-space:nowrap;border:1px solid transparent;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pick-e{background:rgba(61,142,240,.12);color:#5ea8f5;border-color:rgba(61,142,240,.3)}
.pick-c{background:rgba(224,92,48,.12);color:#f07850;border-color:rgba(224,92,48,.3)}
.pick-empty{color:var(--text3);border:1px dashed var(--border2)}
.pick-empty:hover{border-color:var(--text2);color:var(--text2)}
.pick-correct{box-shadow:0 0 0 1.5px var(--green)!important}
.pick-wrong{opacity:.4}

/* FLAG CIRCLE */
.fv{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:var(--bg3);flex-shrink:0;line-height:1;overflow:hidden}
.fvs{width:15px;height:15px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;background:var(--bg3);flex-shrink:0;line-height:1;overflow:hidden}

/* EXPAND PANEL */
.expand-panel{border-top:1px solid var(--border);display:none}
.match-card.expanded .expand-panel{display:block}
.expand-inner{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
@media(max-width:580px){.expand-inner{grid-template-columns:1fr}}
.exp-col{background:var(--bg2);padding:12px 14px}
.exp-col-lbl{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot-e{width:6px;height:6px;border-radius:50%;background:var(--ace);flex-shrink:0}
.dot-c{width:6px;height:6px;border-radius:50%;background:var(--acec);flex-shrink:0}
.exp-ta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;font-family:inherit;padding:8px 10px;resize:vertical;outline:none;min-height:56px;line-height:1.5;-webkit-appearance:none;transition:border-color .15s}
.exp-ta:focus{border-color:var(--border2)}
.exp-ta::placeholder{color:var(--text3)}
.pick-opts-lbl{font-size:11px;color:var(--text3);margin:8px 0 5px}
.pick-opts{display:flex;gap:5px;flex-wrap:wrap}
.pick-opt{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .12s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pick-opt:hover{border-color:var(--text2);color:var(--text)}
.pick-opt.sel-e{background:rgba(61,142,240,.15);color:#5ea8f5;border-color:rgba(61,142,240,.4);font-weight:600}
.pick-opt.sel-c{background:rgba(224,92,48,.15);color:#f07850;border-color:rgba(224,92,48,.4);font-weight:600}

/* RESULT ROW */
.result-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.result-lbl{font-size:11px;color:var(--text3)}
.result-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--gold);font-size:13px;font-weight:700;font-family:inherit;padding:5px 9px;outline:none;width:70px;text-align:center;-webkit-appearance:none}
.result-input:focus{border-color:var(--gold)}
.result-input::placeholder{color:var(--text3);font-weight:400;font-size:12px}
.result-auto{font-size:11px;color:var(--green);display:flex;align-items:center;gap:4px}
.save-btn{font-size:12px;padding:5px 14px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.save-btn:hover{background:var(--gold);border-color:var(--gold);color:#0d0f14;font-weight:600}
.save-btn:active{transform:scale(.97)}
.save-ok{font-size:11px;color:var(--green);opacity:0;transition:opacity .3s;white-space:nowrap}

/* ANALYTICS */
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.stat-tile{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat-val{font-size:24px;font-weight:700;line-height:1}
.stat-val.gold{color:var(--gold)}.stat-val.blue{color:var(--ace)}.stat-val.coral{color:var(--acec)}.stat-val.green{color:var(--green)}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:3px}
.sec-title{font-size:13px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.duel-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:22px}
.duel-side{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.duel-name{font-size:11px;font-weight:600;letter-spacing:.04em;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.duel-name.e{color:var(--ace)}.duel-name.c{color:var(--acec)}
.duel-score{font-size:30px;font-weight:700;line-height:1}
.duel-score.e{color:var(--ace)}.duel-score.c{color:var(--acec)}
.duel-sub{font-size:10px;color:var(--text3);margin-top:3px}
.duel-vs{font-size:15px;font-weight:700;color:var(--text3);text-align:center}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-lbl{font-size:12px;color:var(--text2);width:100px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.bar-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.bar-val{font-size:11px;color:var(--text3);width:18px;text-align:right}
.hist-table{width:100%;border-collapse:collapse;font-size:12px}
.hist-table th{font-size:10px;font-weight:600;color:var(--text3);text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);letter-spacing:.04em;text-transform:uppercase}
.hist-table td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
.hist-table tr:last-child td{border-bottom:none}
.hist-table tr:hover td{background:var(--bg3)}
.bc{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:700}
.bc.ok{background:rgba(46,204,113,.15);color:var(--green)}
.bc.no{background:rgba(231,76,60,.12);color:var(--red)}
.bc.nd{background:var(--bg3);color:var(--text3)}
.empty-state{text-align:center;padding:48px 16px;color:var(--text3);font-size:13px;line-height:2}
.group-pill{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.no-res{text-align:center;padding:32px;color:var(--text3)}
</style>
</head>

<nav>
  <div class="nav-logo">WC 2026 <span>ESPRIT×CLOUN</span></div>
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchPage('schedule',this)">Расписание</div>
    <div class="nav-tab" onclick="switchPage('analytics',this)">Аналитика</div>
  </div>
  <div class="nav-right">
    <div class="sync-dot" id="syncDot"></div>
    <span class="sync-label" id="syncLabel">...</span>
  </div>
</nav>

<!-- API KEY BAR -->
<div class="api-bar" id="apiBar">

</div>

<div id="page-schedule" class="page active">
  <div class="filters-row" id="filtersRow"></div>
  <div id="scheduleRoot"></div>
</div>

<div id="page-analytics" class="page">
  <div id="analyticsRoot"></div>
</div>

// Fetch finished + live fixtures from API-Football
function fetchFixtures(cb){
  if(!apiKey) return;
  var now = new Date();
  var dateStr = now.toISOString().slice(0,10);
  var url = API_BASE+"/fixtures?league="+API_LEAGUE+"&season="+API_SEASON+"&date="+dateStr;

  // Also fetch yesterday in case late games
  fetch(url, {
    method:"GET",
    headers:{
      "x-rapidapi-host": API_HOST,
      "x-rapidapi-key": apiKey
    }
  })
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(data){
    if(data.errors && data.errors.token){ if(cb) cb(false,"неверный ключ"); return; }
    processApiFixtures(data.response||[]);
    if(cb) cb(true,"");
    schedRender();
  })
  .catch(function(e){ if(cb) cb(false,e.message); });
}

function processApiFixtures(fixtures){
  var updated = false;
  fixtures.forEach(function(fx){
    var st = fx.fixture.status.short; // FT, AET, PEN, 1H, HT, 2H, ET, BT, P, LIVE
    var homeEn = fx.teams.home.name;
    var awayEn = fx.teams.away.name;
    var homeRu = EN2RU[homeEn]||homeEn;
    var awayRu = EN2RU[awayEn]||awayEn;
    var g1 = fx.goals.home, g2 = fx.goals.away;
    if(g1===null||g2===null) return;
    var score = g1+":"+g2;
    var isLive = ["1H","HT","2H","ET","BT","P","LIVE"].indexOf(st)>=0;
    var isFinal = ["FT","AET","PEN"].indexOf(st)>=0;
    if(!isLive && !isFinal) return;

    // Find matching local match
    var m = findMatch(homeRu, awayRu);
    if(!m) m = findMatch(homeEn, awayEn);
    if(!m) return;

    var stored = autoResults[m.id]||"";
    var tag = isFinal ? "FT" : "LIVE";
    var val = score+"|"+tag;
    if(val !== stored){
      writeAutoResult(m.id, val);
      updated = true;
    }
  });
  return updated;
}

function findMatch(home, away){
  return MATCHES.find(function(m){
    return (m.home===home&&m.away===away)||(m.home===away&&m.away===home);
  })||null;
}

// Auto-fetch toggle
function toggleAutoFetch(){
  autoFetchOn = !autoFetchOn;
  var btn = document.getElementById("autoFetchBtn");
  if(autoFetchOn){
    btn.textContent="Авто-обновление: вкл";
    btn.className="btn-xs active-btn";
    document.getElementById("countdown").style.display="";
    runFetchLoop();
  } else {
    btn.textContent="Авто-обновление: выкл";
    btn.className="btn-xs";
    document.getElementById("countdown").style.display="none";
    clearTimeout(fetchTimer); clearInterval(countdownTimer);
  }
}
function runFetchLoop(){
  fetchFixtures(null);
  fetchCountdown = 60;
  clearInterval(countdownTimer);
  countdownTimer = setInterval(function(){
    fetchCountdown--;
    document.getElementById("countdown").textContent="следующий запрос через "+fetchCountdown+"с";
    if(fetchCountdown<=0){
      clearInterval(countdownTimer);
      if(autoFetchOn) runFetchLoop();
    }
  },1000);
}

function pad(n){ return n<10?"0"+n:String(n); }
function toTZ(h,m,off){ var hh=h+off; if(hh<0)hh+=24; if(hh>=24)hh-=24; return pad(hh)+":"+pad(m); }
function fmtDate(ds,h,m){ return new Date(ds+"T"+pad(h)+":"+pad(m)+":00Z").toLocaleDateString("ru-RU",{month:"short",day:"numeric"}); }
function fmtDow(ds,h,m){  return new Date(ds+"T"+pad(h)+":"+pad(m)+":00Z").toLocaleDateString("ru-RU",{weekday:"short"}); }
function pickWinner(res,home,away){
  if(!res) return null;
  var clean = res.split("|")[0];
  var p=clean.trim().split(/[:\-]/);
  if(p.length<2) return null;
  var g1=parseInt(p[0]),g2=parseInt(p[1]);
  if(isNaN(g1)||isNaN(g2)) return null;
  if(g1>g2) return home; if(g2>g1) return away; return "Ничья";
}
function getResult(mid){ return results[mid]||""; }
function getAutoResult(mid){ return autoResults[mid]||""; }
function getBestResult(mid){
  // manual result wins; fall back to auto
  var manual = getResult(mid);
  if(manual) return {score:manual,auto:false,live:false};
  var auto = getAutoResult(mid);
  if(!auto) return null;
  var parts = auto.split("|");
  return {score:parts[0], auto:true, live:parts[1]==="LIVE"};
}
function escHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderFilters(){
  document.getElementById("filtersRow").innerHTML=
    FILTERS_CFG.map(function(f){ return '<button class="flt'+(activeFilter===f.key?" active":"")+'" onclick="setFilter(\''+f.key+'\')">'+f.label+'</button>'; }).join("")+
    '<input class="search-box" placeholder="Поиск..." value="'+searchQ+'" oninput="setSearch(this.value)">';
}
function setFilter(k){ activeFilter=k; render(); }
function setSearch(v){ searchQ=v.toLowerCase(); render(); }

function render(){
  renderFilters();
  var root=document.getElementById("scheduleRoot");
  var ms=MATCHES.filter(function(m){ return activeFilter==="all"||m.stage===activeFilter; });
  if(searchQ) ms=ms.filter(function(m){ return m.home.toLowerCase().includes(searchQ)||m.away.toLowerCase().includes(searchQ); });
  if(!ms.length){ root.innerHTML='<div class="no-res">Матчи не найдены</div>'; return; }
  var byStage={}; STAGE_ORDER.forEach(function(s){ byStage[s]=[]; });
  ms.forEach(function(m){ if(byStage[m.stage]) byStage[m.stage].push(m); });
  var html="";
  STAGE_ORDER.forEach(function(stage){
    var list=byStage[stage]; if(!list.length) return;
    html+='<div class="stage-sep">'+STAGE_LABELS[stage]+' <span>'+list.length+' матч'+(list.length===1?"":"ей")+'</span></div>';
    list.forEach(function(m){ html+=renderCard(m); });
  });
  root.innerHTML=html;
  applyMobPicks();
}

function renderCard(m){
  var vt=toTZ(m.utcH,m.utcM,-7), mt=toTZ(m.utcH,m.utcM,+3);
  var ds=fmtDate(m.date,m.utcH,m.utcM), dw=fmtDow(m.date,m.utcH,m.utcM);
  var pe=(picks[m.id]||{}).esprit||"";
  var pc=(picks[m.id]||{}).cloun||"";
  var br=getBestResult(m.id);
  var winner=br?pickWinner(br.score,m.home,m.away):null;
  var isExp=!!expanded[m.id];
  var comE=(comments[m.id]||{}).esprit||"";
  var comC=(comments[m.id]||{}).cloun||"";
  var teams=[m.home,m.away,"Ничья"];

  // Result pill
  var resPill="";
  if(br){
    var pillCls=br.live?"res-pill live":"res-pill fin";
    var autoTag=br.auto?'<span class="res-pill auto">авто</span>':"";
    resPill='<span class="'+pillCls+'">'+br.score+'</span>'+autoTag;
  }

  function pickCls(pick,who){
    var b="pick-badge "+(who==="e"?"pick-e":"pick-c");
    if(!pick) return "pick-badge pick-empty";
    if(!winner) return b;
    return b+(pick===winner?" pick-correct":" pick-wrong");
  }
  function pickLbl(pick,who){
    if(!pick) return who==="e"?"+ ESPRIT":"+ CLOUN";
    return fvs(pick)+pick;
  }

  // Teams row with flags
  var teamsHtml='<span style="display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap">'
    +fv(m.home)+' <span>'+m.home+'</span>'
    +'<span style="color:var(--text3)">—</span>'
    +fv(m.away)+' <span>'+m.away+'</span>'
    +(resPill?" "+resPill:"")
    +'</span>';

  // EXPAND
  var expandHtml="";
  if(isExp){
    var manualRes=getResult(m.id);
    var autoRes=getAutoResult(m.id);
    var autoScore=autoRes?autoRes.split("|")[0]:"";
    var autoTag2=autoRes?autoRes.split("|")[1]:"";
    var opts_e=teams.map(function(t){ return '<span class="pick-opt'+(pe===t?" sel-e":"")+'" onclick="setPick('+m.id+',\'esprit\','+JSON.stringify(t)+')">'+(FLAGS[t]?fvs(t)+' ':"")+t+'</span>'; }).join("");
    var opts_c=teams.map(function(t){ return '<span class="pick-opt'+(pc===t?" sel-c":"")+'" onclick="setPick('+m.id+',\'cloun\','+JSON.stringify(t)+')">'+(FLAGS[t]?fvs(t)+' ':"")+t+'</span>'; }).join("");
    var peDisp=pe?(fvs(pe)+" "+pe):"не выбран";
    var pcDisp=pc?(fvs(pc)+" "+pc):"не выбран";

    var autoBlock=autoScore?'<div class="result-auto">'+fvs("✅")+'Авто: <b style="color:var(--gold)">'+autoScore+'</b> ('+autoTag2+')<span style="color:var(--text3);margin-left:4px">— от API</span></div>':"";

    expandHtml='<div class="expand-panel">'
      +'<div class="expand-inner">'
      +'<div class="exp-col">'
      +'<div class="exp-col-lbl"><div class="dot-e"></div>ESPRIT — Ванкувер'+(pe?' &nbsp;<span style="font-size:10px;color:var(--text3)">пик: '+peDisp+'</span>':"")+'</div>'
      +'<textarea class="exp-ta" id="tE_'+m.id+'" placeholder="Комментарий, ощущения, прогноз..." rows="3" oninput="onCmtInput('+m.id+',\'esprit\',this.value)">'+escHtml(comE)+'</textarea>'
      +'<div class="pick-opts-lbl">Пик:</div><div class="pick-opts">'+opts_e+'</div>'
      +'<div class="result-row">'
      +'<span class="result-lbl">Счёт вручную:</span>'
      +'<input class="result-input" id="ri_'+m.id+'" placeholder="2:1" value="'+escHtml(manualRes)+'" oninput="onResInput('+m.id+',this.value)" onclick="event.stopPropagation()">'
      +'<button class="save-btn" onclick="doSave(event,'+m.id+')">Сохранить</button>'
      +'<span class="save-ok" id="sok_'+m.id+'">✓ сохранено</span>'
      +'</div>'
      +autoBlock
      +'</div>'
      +'<div class="exp-col">'
      +'<div class="exp-col-lbl"><div class="dot-c"></div>CLOUN — Москва'+(pc?' &nbsp;<span style="font-size:10px;color:var(--text3)">пик: '+pcDisp+'</span>':"")+'</div>'
      +'<textarea class="exp-ta" id="tC_'+m.id+'" placeholder="Что думает CLOUN о матче..." rows="3" oninput="onCmtInput('+m.id+',\'cloun\',this.value)">'+escHtml(comC)+'</textarea>'
      +'<div class="pick-opts-lbl">Пик:</div><div class="pick-opts">'+opts_c+'</div>'
      +'</div>'
      +'</div>'
      +'</div>';
  }

  return '<div class="match-card'+(isExp?" expanded":"")+'" id="mc_'+m.id+'">'
    +'<div class="match-row" onclick="toggleExp('+m.id+')">'
    +'<div class="m-num">'+(m.group?'<span class="group-pill">'+m.group+'</span>':m.id)+'</div>'
    +'<div class="m-date"><div class="m-date-main">'+ds+'</div><div class="m-date-sub">'+dw+' · '+m.city+'</div></div>'
    +'<div class="m-time-vk"><div class="m-time-main">'+vt+'</div><div class="m-time-sub">PDT Ванкувер</div></div>'
    +'<div class="m-time-ms"><div class="m-time-main">'+mt+'</div><div class="m-time-sub">MSK Москва</div></div>'
    +'<div class="m-teams">'
    +'<div class="m-teams-name">'+teamsHtml+'</div>'
    +'<div class="m-teams-sub">'+m.venue+'</div>'
    +'<div class="m-teams-sub2">'+vt+' PDT · '+mt+' MSK</div>'
    +'</div>'
    +'<div class="m-pick-cell"><span class="'+pickCls(pe,"e")+'" onclick="openExp(event,'+m.id+')">'+pickLbl(pe,"e")+'</span></div>'
    +'<div class="m-pick-cell"><span class="'+pickCls(pc,"c")+'" onclick="openExp(event,'+m.id+')">'+pickLbl(pc,"c")+'</span></div>'
    +'</div>'
    +'<div class="m-picks-mob" id="mob_'+m.id+'" style="padding:0 12px 10px;gap:7px">'
    +'<span class="'+pickCls(pe,"e")+'" onclick="openExp(event,'+m.id+')">'+pickLbl(pe,"e")+'</span>'
    +'<span class="'+pickCls(pc,"c")+'" onclick="openExp(event,'+m.id+')">'+pickLbl(pc,"c")+'</span>'
    +'</div>'
    +expandHtml
    +'</div>';
}

function applyMobPicks(){
  var mob = window.innerWidth<=640;
  MATCHES.forEach(function(m){
    var el=document.getElementById("mob_"+m.id);
    if(el) el.style.display=mob?"flex":"none";
  });
}
window.addEventListener("resize",function(){ setTimeout(applyMobPicks,50); });

// ══════════════════════════════════════════
// SAVE / INTERACTIONS
// ══════════════════════════════════════════
function onCmtInput(mid,who,val){ if(!_pendingComments[mid])_pendingComments[mid]={}; _pendingComments[mid][who]=val; }
function onResInput(mid,val){ _pendingResults[mid]=val; }
function doSave(e,mid){
  e.stopPropagation();
  var c=_pendingComments[mid];
  if(c){ if(c.esprit!==undefined)writeComment(mid,"esprit",c.esprit); if(c.cloun!==undefined)writeComment(mid,"cloun",c.cloun); delete _pendingComments[mid]; }
  if(_pendingResults[mid]!==undefined){ writeResult(mid,_pendingResults[mid]); delete _pendingResults[mid]; }
  var ok=document.getElementById("sok_"+mid);
  if(ok){ ok.style.opacity="1"; setTimeout(function(){ ok.style.opacity="0"; },2000); }
  schedRender();
}
function toggleExp(id){ expanded[id]=!expanded[id]; render(); if(expanded[id]) scrollTo(id); }
function openExp(e,id){ e.stopPropagation(); expanded[id]=true; render(); scrollTo(id); }
function scrollTo(id){ setTimeout(function(){ var el=document.getElementById("mc_"+id); if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"}); },60); }
function setPick(mid,who,team){ var cur=(picks[mid]||{})[who]; writePick(mid,who,cur===team?"":team); expanded[mid]=true; schedRender(); }

// ══════════════════════════════════════════
// ANALYTICS
// ══════════════════════════════════════════
function renderAnalytics(){
  var root=document.getElementById("analyticsRoot");
  var finished=MATCHES.filter(function(m){ var br=getBestResult(m.id); return br&&!br.live&&pickWinner(br.score,m.home,m.away)!==null; });
  if(!finished.length){ root.innerHTML='<div class="empty-state">Аналитика появится после первых матчей.<br>Включи авто-обновление в шапке (нужен API ключ) или введи счёт вручную.</div>'; return; }
  var ce=0,cc=0; var tw={};
  finished.forEach(function(m){ var br=getBestResult(m.id); var w=pickWinner(br.score,m.home,m.away); if(!w)return; tw[w]=(tw[w]||0)+1; if((picks[m.id]||{}).esprit===w)ce++; if((picks[m.id]||{}).cloun===w)cc++; });
  var pe_t=finished.filter(function(m){ return (picks[m.id]||{}).esprit; }).length;
  var pc_t=finished.filter(function(m){ return (picks[m.id]||{}).cloun;  }).length;
  function pct(n,d){ return d?Math.round(n/d*100):0; }
  var top=Object.entries(tw).sort(function(a,b){ return b[1]-a[1]; }).slice(0,8);
  var maxW=top[0]?top[0][1]:1;
  var autoCount=finished.filter(function(m){ return getBestResult(m.id)&&getBestResult(m.id).auto; }).length;

  var histRows=finished.slice(-25).reverse().map(function(m){
    var br=getBestResult(m.id); var w=pickWinner(br.score,m.home,m.away);
    var pe=(picks[m.id]||{}).esprit||""; var pc=(picks[m.id]||{}).cloun||"";
    var bE=!pe?'<span class="bc nd">—</span>':pe===w?'<span class="bc ok">✓</span>':'<span class="bc no">✗</span>';
    var bC=!pc?'<span class="bc nd">—</span>':pc===w?'<span class="bc ok">✓</span>':'<span class="bc no">✗</span>';
    var autoTag=br.auto?'<span class="res-pill auto" style="margin-left:3px">авто</span>':"";
    return '<tr>'
      +'<td>'+fmtDate(m.date,m.utcH,m.utcM)+'</td>'
      +'<td><span style="display:inline-flex;align-items:center;gap:3px">'+fvs(m.home)+m.home+'&nbsp;—&nbsp;'+fvs(m.away)+m.away+'</span></td>'
      +'<td style="color:var(--gold);font-weight:700">'+br.score+autoTag+'</td>'
      +'<td>'+(pe?(fvs(pe)+" "+pe):"—")+" "+bE+'</td>'
      +'<td>'+(pc?(fvs(pc)+" "+pc):"—")+" "+bC+'</td>'
      +'</tr>';
  }).join("");

  root.innerHTML=
    '<div class="analytics-grid">'
    +'<div class="stat-tile"><div class="stat-val gold">'+finished.length+'</div><div class="stat-lbl">матчей сыграно</div></div>'
    +'<div class="stat-tile"><div class="stat-val green">'+autoCount+'</div><div class="stat-lbl">результатов авто</div></div>'
    +'<div class="stat-tile"><div class="stat-val blue">'+ce+"/"+pe_t+'</div><div class="stat-lbl">угаданных — ESPRIT</div></div>'
    +'<div class="stat-tile"><div class="stat-val coral">'+cc+"/"+pc_t+'</div><div class="stat-lbl">угаданных — CLOUN</div></div>'
    +'</div>'
    +'<div class="sec-title">Счёт угадывания</div>'
    +'<div class="duel-row">'
    +'<div class="duel-side"><div class="duel-name e">ESPRIT</div>'
    +'<div class="duel-score e">'+pct(ce,pe_t)+'<span style="font-size:15px;font-weight:400;color:var(--text2)">%</span></div>'
    +'<div class="duel-sub">'+ce+' из '+pe_t+' пиков верно</div></div>'
    +'<div class="duel-vs">VS</div>'
    +'<div class="duel-side"><div class="duel-name c">CLOUN</div>'
    +'<div class="duel-score c">'+pct(cc,pc_t)+'<span style="font-size:15px;font-weight:400;color:var(--text2)">%</span></div>'
    +'<div class="duel-sub">'+cc+' из '+pc_t+' пиков верно</div></div>'
    +'</div>'
    +(top.length?'<div class="sec-title">Победы по командам</div><div style="margin-bottom:22px">'+
      top.map(function(e){ return '<div class="bar-row"><div class="bar-lbl">'+fvs(e[0])+e[0]+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(e[1]/maxW*100)+'%;background:var(--gold)"></div></div><div class="bar-val">'+e[1]+'</div></div>'; }).join("")
    +'</div>':"")
    +'<div class="sec-title">История матчей</div>'
    +'<div style="overflow-x:auto"><table class="hist-table">'
    +'<thead><tr><th>Дата</th><th>Матч</th><th>Счёт</th><th>ESPRIT</th><th>CLOUN</th></tr></thead>'
    +'<tbody>'+histRows+'</tbody></table></div>';
}

// ══════════════════════════════════════════
// PAGES
// ══════════════════════════════════════════
function switchPage(id,el){
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  document.querySelectorAll(".nav-tab").forEach(function(t){ t.classList.remove("active"); });
  document.getElementById("page-"+id).classList.add("active");
  el.classList.add("active");
  if(id==="analytics") renderAnalytics();
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
if(apiKey){
  document.getElementById("apiKeyInput").value="●".repeat(20);
  setApiStatus("","ключ сохранён — нажми «Проверить»");
  document.getElementById("autoFetchBtn").style.display="";
}
render();
setTimeout(applyMobPicks,100);
</script>
