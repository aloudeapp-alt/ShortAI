<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WC 2026 — ESPRIT & CLOUN</title>
<style>
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e29;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
  --text:#e8eaf0;--text2:#7a8099;--text3:#4a5068;
  --ace:#3d8ef0;--acec:#e05c30;--gold:#c9a227;
  --green:#2ecc71;--red:#e74c3c;
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}

/* ── NAV ── */
nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;position:sticky;top:0;z-index:100;min-height:48px}
.nav-logo{font-size:14px;font-weight:700;color:var(--gold);letter-spacing:.03em;white-space:nowrap;flex-shrink:0}
.nav-logo span{color:var(--text2);font-weight:400}
.nav-tabs{display:flex;margin-left:16px}
.nav-tab{padding:12px 14px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--text);border-bottom-color:var(--gold)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s;flex-shrink:0}
.sync-dot.online{background:var(--green)}
.sync-dot.syncing{background:var(--gold);animation:pulse .8s infinite}
.sync-dot.error{background:var(--red)}
.sync-label{font-size:11px;color:var(--text2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── PAGES ── */
.page{display:none;padding:12px 16px;max-width:900px;margin:0 auto}
.page.active{display:block}

/* ── FILTERS ── */
.filters-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.flt{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.flt:hover{border-color:var(--text2);color:var(--text)}
.flt.active{background:var(--gold);border-color:var(--gold);color:#0d0f14;font-weight:600}
.search-box{margin-left:auto;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-size:12px;outline:none;width:140px;flex-shrink:0}
.search-box:focus{border-color:var(--text2)}

/* ── STAGE HEADER ── */
.stage-sep{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:16px 0 6px;border-bottom:1px solid var(--border);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.stage-sep span{color:var(--text2);font-size:10px;font-weight:400;letter-spacing:0;text-transform:none}

/* ── MATCH CARD ── */
.match-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:4px;overflow:hidden;transition:border-color .15s}
.match-card.expanded{border-color:var(--border2)}

/* Desktop row */
.match-row{display:grid;grid-template-columns:24px 90px 70px 70px 1fr 100px 100px;align-items:center;padding:10px 12px;cursor:pointer;gap:6px;user-select:none}
/* Mobile row — stacked */
@media(max-width:600px){
  .match-row{grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:4px 8px;padding:10px 12px}
  .m-num{display:none}
  .m-time-vk,.m-time-ms{display:none}
  .m-teams{grid-column:1;grid-row:1}
  .m-date{grid-column:2;grid-row:1;text-align:right}
  .m-picks-mobile{grid-column:1/-1;grid-row:2;display:flex;gap:8px}
  .m-pick-cell{display:none}
  .m-picks-mobile .pick-badge{flex:1;justify-content:center}
}
@media(min-width:601px){.m-picks-mobile{display:none}}

.m-num{font-size:10px;color:var(--text3);text-align:center}
.m-date-main{font-size:12px;font-weight:500;white-space:nowrap}
.m-date-sub{font-size:10px;color:var(--text2)}
.m-time-main{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.m-time-sub{font-size:10px;color:var(--text3)}
.m-teams-name{font-size:13px;font-weight:500;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.m-teams-sub{font-size:10px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-pill{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--bg3);color:var(--gold);white-space:nowrap;flex-shrink:0}
.m-pick-cell{display:flex;justify-content:center}
.pick-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;max-width:98px;overflow:hidden;cursor:pointer;transition:all .12s;white-space:nowrap;border:1px solid transparent;flex-shrink:0}
.pick-e{background:rgba(61,142,240,.12);color:#5ea8f5;border-color:rgba(61,142,240,.3)}
.pick-c{background:rgba(224,92,48,.12);color:#f07850;border-color:rgba(224,92,48,.3)}
.pick-empty{color:var(--text3);border:1px dashed var(--border2);background:transparent}
.pick-empty:hover{border-color:var(--text2);color:var(--text2)}
.pick-correct{box-shadow:0 0 0 1.5px var(--green)!important}
.pick-wrong{opacity:.4}

/* ── FLAG AVATAR ── */
.flag-av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;background:var(--bg3);flex-shrink:0;line-height:1;overflow:hidden}
.flag-av-sm{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;background:var(--bg3);flex-shrink:0;line-height:1;overflow:hidden}

/* ── EXPAND PANEL ── */
.expand-panel{border-top:1px solid var(--border);display:none}
.match-card.expanded .expand-panel{display:block}
.expand-inner{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
@media(max-width:600px){.expand-inner{grid-template-columns:1fr}}
.exp-col{background:var(--bg2);padding:12px 14px}
.exp-col-label{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dot-e{width:6px;height:6px;border-radius:50%;background:var(--ace);flex-shrink:0}
.dot-c{width:6px;height:6px;border-radius:50%;background:var(--acec);flex-shrink:0}
.exp-textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;font-family:inherit;padding:8px 10px;resize:vertical;outline:none;min-height:56px;transition:border-color .15s;line-height:1.5;-webkit-appearance:none}
.exp-textarea:focus{border-color:var(--border2)}
.exp-textarea::placeholder{color:var(--text3)}
.exp-pick-label{font-size:11px;color:var(--text3);margin:8px 0 5px}
.pick-opts{display:flex;gap:5px;flex-wrap:wrap}
.pick-opt{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .12s;white-space:nowrap}
.pick-opt:hover{border-color:var(--text2);color:var(--text)}
.pick-opt.sel-e{background:rgba(61,142,240,.15);color:#5ea8f5;border-color:rgba(61,142,240,.4);font-weight:600}
.pick-opt.sel-c{background:rgba(224,92,48,.15);color:#f07850;border-color:rgba(224,92,48,.4);font-weight:600}
.result-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.result-label{font-size:11px;color:var(--text3)}
.result-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--gold);font-size:13px;font-weight:700;font-family:inherit;padding:5px 9px;outline:none;width:72px;-webkit-appearance:none;text-align:center}
.result-input:focus{border-color:var(--gold)}
.result-input::placeholder{color:var(--text3);font-weight:400;font-size:12px}
.save-btn{font-size:12px;padding:5px 14px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;transition:all .15s;font-family:inherit}
.save-btn:hover{background:var(--gold);border-color:var(--gold);color:#0d0f14;font-weight:600}
.save-btn:active{opacity:.8;transform:scale(.97)}
.save-ok{font-size:11px;color:var(--green);opacity:0;transition:opacity .3s;white-space:nowrap}

/* ── ANALYTICS ── */
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:24px}
.stat-tile{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat-tile-val{font-size:26px;font-weight:700;line-height:1}
.stat-tile-val.gold{color:var(--gold)}
.stat-tile-val.blue{color:var(--ace)}
.stat-tile-val.coral{color:var(--acec)}
.stat-tile-lbl{font-size:11px;color:var(--text2);margin-top:3px}
.section-title{font-size:13px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.duel-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:24px}
.duel-side{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.duel-name{font-size:11px;font-weight:600;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.duel-name.e{color:var(--ace)}
.duel-name.c{color:var(--acec)}
.duel-score{font-size:32px;font-weight:700;line-height:1}
.duel-score.e{color:var(--ace)}
.duel-score.c{color:var(--acec)}
.duel-sub{font-size:10px;color:var(--text3);margin-top:3px}
.duel-vs{font-size:16px;font-weight:700;color:var(--text3);text-align:center}
.chart-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.chart-bar-label{font-size:12px;color:var(--text2);width:96px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:flex-end;gap:5px}
.chart-bar-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.chart-bar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.chart-bar-val{font-size:11px;color:var(--text3);width:20px;flex-shrink:0;text-align:right}
.history-table{width:100%;border-collapse:collapse;font-size:12px}
.history-table th{font-size:10px;font-weight:600;color:var(--text3);text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);letter-spacing:.05em;text-transform:uppercase}
.history-table td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
.history-table tr:last-child td{border-bottom:none}
.history-table tr:hover td{background:var(--bg3)}
.badge-correct{font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(46,204,113,.15);color:var(--green);font-weight:700}
.badge-wrong{font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(231,76,60,.12);color:var(--red);font-weight:700}
.badge-pending{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--bg3);color:var(--text3)}
.empty-state{text-align:center;padding:48px 16px;color:var(--text3);font-size:13px;line-height:2}
.group-pill{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--bg3);color:var(--text3);border:1px solid var(--border);flex-shrink:0}
.no-results{text-align:center;padding:32px;color:var(--text3)}

/* ── MOBILE NAV HINT ── */
.mobile-times{display:none;font-size:10px;color:var(--text3);margin-top:2px}
@media(max-width:600px){.mobile-times{display:block}}
</style>
</head>

const gun = GUN({
  peers: [
    "https://gun-rs.alwaysdata.net/gun",
    "https://gun-us.herokuapp.com/gun",
    "wss://gun-manhattan.herokuapp.com/gun"
  ],
  localStorage: true,
  radisk: false
});

const room = gun.get("wc2026__" + ROOM_KEY);

// Подписка
room.get("picks").map().on(function(val, mid){
  if(!val) return;
  try { picks[mid] = JSON.parse(val); } catch(e){ picks[mid]=val; }
  scheduleRender();
});
room.get("comments").map().on(function(val, mid){
  if(!val) return;
  try { comments[mid] = JSON.parse(val); } catch(e){}
  scheduleRender();
});
room.get("results").map().on(function(val, mid){
  if(val===null||val===undefined) return;
  results[mid] = val;
  scheduleRender();
});

gun.on("hi",  function(){ setSyncStatus("online","онлайн"); });
gun.on("bye", function(){ setSyncStatus("error","оффлайн"); });

    setSyncStatus("online","онлайн");

function setSyncStatus(s,l){

}

//  ЗАПИСЬ в GUN
// ══════════════════════════════════════════════
function writePick(mid, who, val){
  var cur = picks[mid] ? Object.assign({},picks[mid]) : {};
  cur[who] = val;
  picks[mid] = cur;
  room.get("picks").get(String(mid)).put(JSON.stringify(cur));
  flashSync();
}
function writeComment(mid, who, val){
  var cur = comments[mid] ? Object.assign({},comments[mid]) : {};
  cur[who] = val;
  comments[mid] = cur;
  room.get("comments").get(String(mid)).put(JSON.stringify(cur));
}
function writeResult(mid, val){
  results[mid] = val;
  room.get("results").get(String(mid)).put(val);
  flashSync();
}
function flashSync(){
  setSyncStatus("syncing","сохранение...");
  setTimeout(function(){ setSyncStatus("online","онлайн"); }, 900);
}

// ══════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════
function pad(n){ return n<10?"0"+n:String(n); }
function toTZ(h,m,off){ var hh=h+off; if(hh<0)hh+=24; if(hh>=24)hh-=24; return pad(hh)+":"+pad(m); }
function fmtDate(ds,h,m){ var d=new Date(ds+"T"+pad(h)+":"+pad(m)+":00Z"); return d.toLocaleDateString("ru-RU",{month:"short",day:"numeric"}); }
function fmtDow(ds,h,m){  var d=new Date(ds+"T"+pad(h)+":"+pad(m)+":00Z"); return d.toLocaleDateString("ru-RU",{weekday:"short"}); }
function pickWinner(res,home,away){
  if(!res) return null;
  var p=res.trim().split(/[:\-]/);
  if(p.length<2) return null;
  var g1=parseInt(p[0]),g2=parseInt(p[1]);
  if(isNaN(g1)||isNaN(g2)) return null;
  if(g1>g2) return home; if(g2>g1) return away; return "Ничья";
}

// ══════════════════════════════════════════════
//  RENDER debounce
// ══════════════════════════════════════════════
var _rt;
function scheduleRender(){
  clearTimeout(_rt);
  _rt = setTimeout(function(){
    render();
    if(document.getElementById("page-analytics").classList.contains("active")) renderAnalytics();
  }, 60);
}

// ══════════════════════════════════════════════
//  FILTERS
// ══════════════════════════════════════════════
function renderFilters(){
  document.getElementById("filtersRow").innerHTML =
    FILTERS_CFG.map(function(f){
      return '<button class="flt'+(activeFilter===f.key?" active":"")+'" onclick="setFilter(\''+f.key+'\')">'+f.label+'</button>';
    }).join("")+
    '<input class="search-box" placeholder="Поиск..." value="'+searchQ+'" oninput="setSearch(this.value)">';
}
function setFilter(k){ activeFilter=k; render(); }
function setSearch(v){ searchQ=v.toLowerCase(); render(); }

// ══════════════════════════════════════════════
//  MAIN RENDER
// ══════════════════════════════════════════════
function render(){
  renderFilters();
  var root = document.getElementById("scheduleRoot");
  var ms = MATCHES.filter(function(m){ return activeFilter==="all"||m.stage===activeFilter; });
  if(searchQ) ms = ms.filter(function(m){
    return m.home.toLowerCase().includes(searchQ)||m.away.toLowerCase().includes(searchQ);
  });
  if(!ms.length){ root.innerHTML='<div class="no-results">Матчи не найдены</div>'; return; }
  var byStage = {};
  STAGE_ORDER.forEach(function(s){ byStage[s]=[]; });
  ms.forEach(function(m){ if(byStage[m.stage]) byStage[m.stage].push(m); });
  var html = "";
  STAGE_ORDER.forEach(function(stage){
    var list = byStage[stage];
    if(!list.length) return;
    html += '<div class="stage-sep">'+STAGE_LABELS[stage]+' <span>'+list.length+' матч'+(list.length===1?"":"ей")+'</span></div>';
    list.forEach(function(m){ html += renderCard(m); });
  });
  root.innerHTML = html;
}

function renderCard(m){
  var vt = toTZ(m.utcH,m.utcM,-7);
  var mt = toTZ(m.utcH,m.utcM,+3);
  var ds = fmtDate(m.date,m.utcH,m.utcM);
  var dw = fmtDow(m.date,m.utcH,m.utcM);
  var pe = (picks[m.id]||{}).esprit||"";
  var pc = (picks[m.id]||{}).cloun||"";
  var res = results[m.id]||"";
  var winner = pickWinner(res,m.home,m.away);
  var resPill = res ? '<span class="result-pill">'+res+'</span>' : "";
  var isExp = !!expanded[m.id];
  var comE = (comments[m.id]||{}).esprit||"";
  var comC = (comments[m.id]||{}).cloun||"";
  var teams = [m.home, m.away, "Ничья"];

  function pickCls(pick,who){
    if(!pick) return "pick-badge pick-empty";
    var b = "pick-badge "+(who==="e"?"pick-e":"pick-c");
    if(!winner) return b;
    return b+(pick===winner?" pick-correct":" pick-wrong");
  }
  function pickLabel(pick,who){
    var team = pick || (who==="e"?"+ ESPRIT":"+ CLOUN");
    var f = pick ? flagAv(pick,true) : "";
    return f+team;
  }

  // Teams display with flags
  var homeDisp = flagAv(m.home,false)+" "+m.home;
  var awayDisp = flagAv(m.away,false)+" "+m.away;
  var teamsName = '<span style="display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap">'
    + flagAv(m.home,false)+' <span>'+m.home+'</span>'
    + '<span style="color:var(--text3);margin:0 2px">—</span>'
    + flagAv(m.away,false)+' <span>'+m.away+'</span>'
    + (resPill ? " "+resPill : "")
    + '</span>';

  var expandPanel = "";
  if(isExp){
    var opts_e = teams.map(function(t){
      var hasFlag = FLAGS[t] ? flagAv(t,true)+" " : "";
      return '<span class="pick-opt'+(pe===t?" sel-e":"")
        +'" onclick="setPick('+m.id+',\'esprit\','+JSON.stringify(t)+')">'+hasFlag+t+'</span>';
    }).join("");
    var opts_c = teams.map(function(t){
      var hasFlag = FLAGS[t] ? flagAv(t,true)+" " : "";
      return '<span class="pick-opt'+(pc===t?" sel-c":"")
        +'" onclick="setPick('+m.id+',\'cloun\','+JSON.stringify(t)+')">'+hasFlag+t+'</span>';
    }).join("");

    var peLabel = pe ? (flagAv(pe,true)+" "+pe) : "не выбран";
    var pcLabel = pc ? (flagAv(pc,true)+" "+pc) : "не выбран";

    expandPanel = '<div class="expand-panel">'
      +'<div class="expand-inner">'
      // ESPRIT col
      +'<div class="exp-col">'
      +'<div class="exp-col-label"><div class="dot-e"></div>ESPRIT — Ванкувер'
      +(pe ? ' &nbsp;<span style="font-size:11px;color:var(--text2)">пик: '+peLabel+'</span>' : '')
      +'</div>'
      +'<textarea class="exp-textarea" id="tE_'+m.id+'" placeholder="Комментарий, ощущения, прогноз..." rows="3"'
      +' oninput="onCommentInput('+m.id+',\'esprit\',this.value)">'+escHtml(comE)+'</textarea>'
      +'<div class="exp-pick-label">Пик — кто выиграет:</div>'
      +'<div class="pick-opts">'+opts_e+'</div>'
      +'<div class="result-row">'
      +'<span class="result-label">Счёт:</span>'
      +'<input class="result-input" id="ri_'+m.id+'" placeholder="2:1" value="'+escHtml(res)+'"'
      +' oninput="onResultInput('+m.id+',this.value)" onclick="event.stopPropagation()">'
      +'<button class="save-btn" onclick="doSave(event,'+m.id+')">Сохранить</button>'
      +'<span class="save-ok" id="sok_'+m.id+'">✓ сохранено</span>'
      +'</div>'
      +'</div>'
      // CLOUN col
      +'<div class="exp-col">'
      +'<div class="exp-col-label"><div class="dot-c"></div>CLOUN — Москва'
      +(pc ? ' &nbsp;<span style="font-size:11px;color:var(--text2)">пик: '+pcLabel+'</span>' : '')
      +'</div>'
      +'<textarea class="exp-textarea" id="tC_'+m.id+'" placeholder="Что думает CLOUN о матче..." rows="3"'
      +' oninput="onCommentInput('+m.id+',\'cloun\',this.value)">'+escHtml(comC)+'</textarea>'
      +'<div class="exp-pick-label">Пик — кто выиграет:</div>'
      +'<div class="pick-opts">'+opts_c+'</div>'
      +'</div>'
      +'</div>'
      +'</div>';
  }

  return '<div class="match-card'+(isExp?" expanded":"")+('" id="mc_'+m.id+'">')
    +'<div class="match-row" onclick="toggleExpand('+m.id+')">'
    +'<div class="m-num">'+(m.group?'<span class="group-pill">'+m.group+'</span>':m.id)+'</div>'
    +'<div class="m-date"><div class="m-date-main">'+ds+'</div><div class="m-date-sub">'+dw+' · '+m.city+'</div></div>'
    +'<div class="m-time-vk"><div class="m-time-main">'+vt+'</div><div class="m-time-sub">PDT Ванкувер</div></div>'
    +'<div class="m-time-ms"><div class="m-time-main">'+mt+'</div><div class="m-time-sub">MSK Москва</div></div>'
    +'<div class="m-teams">'
    +'<div class="m-teams-name">'+teamsName+'</div>'
    +'<div class="m-teams-sub">'+m.venue+'</div>'
    +'<div class="mobile-times">'+vt+' PDT · '+mt+' MSK</div>'
    +'</div>'
    // desktop pick columns
    +'<div class="m-pick-cell"><span class="'+pickCls(pe,"e")+'" onclick="openExpand(event,'+m.id+')">'+pickLabel(pe,"e")+'</span></div>'
    +'<div class="m-pick-cell"><span class="'+pickCls(pc,"c")+'" onclick="openExpand(event,'+m.id+')">'+pickLabel(pc,"c")+'</span></div>'
    +'</div>'
    // mobile picks row (inside card, below main row)
    +'<div class="m-picks-mobile" style="padding:0 12px 10px;gap:8px;display:none" id="mob_'+m.id+'">'
    +'<span class="pick-badge '+pickCls(pe,"e")+'" onclick="openExpand(event,'+m.id+')">'+pickLabel(pe,"e")+'</span>'
    +'<span class="pick-badge '+pickCls(pc,"c")+'" onclick="openExpand(event,'+m.id+')">'+pickLabel(pc,"c")+'</span>'
    +'</div>'
    + expandPanel
    +'</div>';
}

function escHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// Pending comment/result buffers (save on button)
var _pendingComments = {};
var _pendingResults = {};

function onCommentInput(mid, who, val){
  if(!_pendingComments[mid]) _pendingComments[mid] = {};
  _pendingComments[mid][who] = val;
}
function onResultInput(mid, val){
  _pendingResults[mid] = val;
}
function doSave(e, mid){
  e.stopPropagation();
  // save comment
  if(_pendingComments[mid]){
    var c = _pendingComments[mid];
    if(c.esprit !== undefined) writeComment(mid,"esprit",c.esprit);
    if(c.cloun  !== undefined) writeComment(mid,"cloun", c.cloun);
    delete _pendingComments[mid];
  }
  // save result
  if(_pendingResults[mid] !== undefined){
    writeResult(mid, _pendingResults[mid]);
    delete _pendingResults[mid];
  }
  var ok = document.getElementById("sok_"+mid);
  if(ok){ ok.style.opacity="1"; setTimeout(function(){ ok.style.opacity="0"; },2000); }
  scheduleRender();
}

function toggleExpand(id){ expanded[id]=!expanded[id]; render(); if(expanded[id]) scrollToCard(id); }
function openExpand(e,id){ e.stopPropagation(); expanded[id]=true; render(); scrollToCard(id); }
function scrollToCard(id){ setTimeout(function(){ var el=document.getElementById("mc_"+id); if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"}); },60); }

function setPick(mid,who,team){
  var cur = (picks[mid]||{})[who];
  writePick(mid, who, cur===team?"":team);
  expanded[mid]=true;
  scheduleRender();
}

// Show mobile picks rows after render
function applyMobilePicks(){
  var isMobile = window.innerWidth <= 600;
  MATCHES.forEach(function(m){
    var el = document.getElementById("mob_"+m.id);
    if(el) el.style.display = isMobile ? "flex" : "none";
  });
}

// ══════════════════════════════════════════════
//  ANALYTICS
// ══════════════════════════════════════════════
function renderAnalytics(){
  var root = document.getElementById("analyticsRoot");
  var finished = MATCHES.filter(function(m){ return results[m.id] && pickWinner(results[m.id],m.home,m.away)!==null; });
  if(!finished.length){
    root.innerHTML='<div class="empty-state">Аналитика появится после первых матчей.<br>Введи счёт в карточке матча и нажми «Сохранить».</div>';
    return;
  }
  var ce=0,cc=0;
  var teamWins={};
  finished.forEach(function(m){
    var w=pickWinner(results[m.id],m.home,m.away);
    if(!w) return;
    teamWins[w]=(teamWins[w]||0)+1;
    if((picks[m.id]||{}).esprit===w) ce++;
    if((picks[m.id]||{}).cloun===w)  cc++;
  });
  var pe_t=finished.filter(function(m){ return (picks[m.id]||{}).esprit; }).length;
  var pc_t=finished.filter(function(m){ return (picks[m.id]||{}).cloun;  }).length;
  function pct(n,d){ return d?Math.round(n/d*100):0; }
  var topTeams=Object.entries(teamWins).sort(function(a,b){ return b[1]-a[1]; }).slice(0,8);
  var maxW=topTeams[0]?topTeams[0][1]:1;

  var histRows=finished.slice(-20).reverse().map(function(m){
    var res=results[m.id];
    var w=pickWinner(res,m.home,m.away);
    var pe=(picks[m.id]||{}).esprit||"—";
    var pc=(picks[m.id]||{}).cloun||"—";
    var bE=!(picks[m.id]||{}).esprit?'<span class="badge-pending">—</span>':pe===w?'<span class="badge-correct">✓</span>':'<span class="badge-wrong">✗</span>';
    var bC=!(picks[m.id]||{}).cloun ?'<span class="badge-pending">—</span>':pc===w?'<span class="badge-correct">✓</span>':'<span class="badge-wrong">✗</span>';
    var peDisp = pe!=="—" ? (flagAv(pe,true)+" "+pe) : "—";
    var pcDisp = pc!=="—" ? (flagAv(pc,true)+" "+pc) : "—";
    return '<tr>'
      +'<td>'+fmtDate(m.date,m.utcH,m.utcM)+'</td>'
      +'<td style="display:flex;align-items:center;gap:4px">'+flagAv(m.home,true)+' '+m.home+' — '+flagAv(m.away,true)+' '+m.away+'</td>'
      +'<td style="color:var(--gold);font-weight:700">'+res+'</td>'
      +'<td>'+peDisp+' '+bE+'</td>'
      +'<td>'+pcDisp+' '+bC+'</td>'
      +'</tr>';
  }).join("");

  root.innerHTML=
    '<div class="analytics-grid">'
    +'<div class="stat-tile"><div class="stat-tile-val gold">'+finished.length+'</div><div class="stat-tile-lbl">матчей сыграно</div></div>'
    +'<div class="stat-tile"><div class="stat-tile-val blue">'+ce+' / '+pe_t+'</div><div class="stat-tile-lbl">угаданных — ESPRIT</div></div>'
    +'<div class="stat-tile"><div class="stat-tile-val coral">'+cc+' / '+pc_t+'</div><div class="stat-tile-lbl">угаданных — CLOUN</div></div>'
    +'<div class="stat-tile"><div class="stat-tile-val">'+(MATCHES.length-finished.length)+'</div><div class="stat-tile-lbl">матчей впереди</div></div>'
    +'</div>'
    +'<div class="section-title">Счёт угадывания</div>'
    +'<div class="duel-row">'
    +'<div class="duel-side">'
    +'<div class="duel-name e">ESPRIT</div>'
    +'<div class="duel-score e">'+pct(ce,pe_t)+'<span style="font-size:16px;font-weight:400;color:var(--text2)">%</span></div>'
    +'<div class="duel-sub">'+ce+' из '+pe_t+' пиков верно</div>'
    +'</div>'
    +'<div class="duel-vs">VS</div>'
    +'<div class="duel-side">'
    +'<div class="duel-name c">CLOUN</div>'
    +'<div class="duel-score c">'+pct(cc,pc_t)+'<span style="font-size:16px;font-weight:400;color:var(--text2)">%</span></div>'
    +'<div class="duel-sub">'+cc+' из '+pc_t+' пиков верно</div>'
    +'</div>'
    +'</div>'
    +(topTeams.length?
      '<div class="section-title">Победы по командам</div>'
      +'<div style="margin-bottom:24px">'+topTeams.map(function(e){
        return '<div class="chart-bar-row">'
          +'<div class="chart-bar-label">'+flagAv(e[0],true)+' '+e[0]+'</div>'
          +'<div class="chart-bar-track"><div class="chart-bar-fill" style="width:'+Math.round(e[1]/maxW*100)+'%;background:var(--gold)"></div></div>'
          +'<div class="chart-bar-val">'+e[1]+'</div>'
          +'</div>';
      }).join("")+'</div>'
    :'')
    +'<div class="section-title">История матчей</div>'
    +'<div style="overflow-x:auto"><table class="history-table">'
    +'<thead><tr><th>Дата</th><th>Матч</th><th>Счёт</th><th>ESPRIT</th><th>CLOUN</th></tr></thead>'
    +'<tbody>'+histRows+'</tbody>'
    +'</table></div>';
}

// ══════════════════════════════════════════════
//  PAGE SWITCH
// ══════════════════════════════════════════════
function switchPage(id,el){
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  document.querySelectorAll(".nav-tab").forEach(function(t){ t.classList.remove("active"); });
  document.getElementById("page-"+id).classList.add("active");
  el.classList.add("active");
  if(id==="analytics") renderAnalytics();
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
render();
window.addEventListener("resize", function(){ applyMobilePicks(); });
setTimeout(applyMobilePicks, 100);
</script>
