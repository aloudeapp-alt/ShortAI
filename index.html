<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WC 2026 — ESPRIT & CLOUN</title>
<style>
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e29;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
  --text:#e8eaf0;--text2:#7a8099;--text3:#4a5068;
  --ace:#3d8ef0;--acec:#e05c30;--gold:#c9a227;
  --green:#2ecc71;--red:#e74c3c;--orange:#e8890c;
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}
nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;position:sticky;top:0;z-index:100;min-height:48px}
.nav-logo{font-size:14px;font-weight:700;color:var(--gold);white-space:nowrap;flex-shrink:0}
.nav-logo span{color:var(--text2);font-weight:400}
.nav-tabs{display:flex;margin-left:10px}
.nav-tab{padding:12px 12px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--text);border-bottom-color:var(--gold)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0}
.sync-dot.online{background:var(--green)}
.sync-dot.syncing{background:var(--gold);animation:pulse .8s infinite}
.sync-dot.error{background:var(--red)}
.sync-lbl{font-size:11px;color:var(--text2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* SETTINGS PANEL */
.set-bar{background:var(--bg3);border-bottom:1px solid var(--border);padding:7px 16px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3);flex-wrap:wrap}
.api-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0}
.api-dot.ok{background:var(--green)}
.api-dot.err{background:var(--red)}
.api-dot.check{background:var(--orange);animation:pulse .8s infinite}
.btn-xs{font-size:11px;padding:3px 10px;border-radius:var(--rs);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-xs:hover{background:var(--bg2);color:var(--text)}
.btn-xs.on{background:var(--green);border-color:var(--green);color:#0d0f14;font-weight:600}
.cdn{font-variant-numeric:tabular-nums;color:var(--text3)}
.set-link{color:var(--ace);text-decoration:none;cursor:pointer}

.page{display:none;padding:12px 16px;max-width:920px;margin:0 auto}
.page.active{display:block}
.filters-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.flt{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.flt:hover{border-color:var(--text2);color:var(--text)}
.flt.active{background:var(--gold);border-color:var(--gold);color:#0d0f14;font-weight:600}
.search-box{margin-left:auto;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-size:12px;outline:none;width:130px}
.search-box:focus{border-color:var(--text2)}
.stage-sep{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:16px 0 6px;border-bottom:1px solid var(--border);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.stage-sep span{color:var(--text2);font-size:10px;font-weight:400;letter-spacing:0;text-transform:none}
.match-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:4px;overflow:hidden;transition:border-color .15s}
.match-card.expanded{border-color:var(--border2)}
.match-card:hover{border-color:var(--border2)}
.match-row{display:grid;grid-template-columns:24px 94px 70px 70px 1fr 108px 108px;align-items:center;padding:10px 12px;cursor:pointer;gap:6px;user-select:none}
@media(max-width:640px){
  .match-row{grid-template-columns:1fr auto;grid-template-rows:auto auto;padding:10px 12px;gap:3px 8px}
  .m-num,.m-tvk,.m-tms,.m-pc{display:none}
  .m-teams{grid-column:1;grid-row:1}
  .m-date{grid-column:2;grid-row:1;text-align:right}
  .m-mob{display:flex}
  /* при раскрытии карточки прячем мобильный ряд (пики есть внутри панели) */
  .match-card.expanded .m-mob{display:none}
}
@media(min-width:641px){
  .m-mob{display:none!important}
}
.m-mob{display:none;grid-column:1/-1;grid-row:2;gap:7px}
.m-num{font-size:10px;color:var(--text3);text-align:center}
.m-date-main{font-size:12px;font-weight:500;white-space:nowrap}
.m-date-sub{font-size:10px;color:var(--text2)}
.m-t-main{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.m-t-sub{font-size:10px;color:var(--text3)}
.m-teams-name{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:13px;font-weight:500}
.m-teams-sub{font-size:10px;color:var(--text2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-teams-sub2{font-size:10px;color:var(--text3);margin-top:1px}

/* FLAG — real SVG images from flagcdn */
.fv{width:21px;height:15px;border-radius:2px;object-fit:cover;flex-shrink:0;vertical-align:middle;background:var(--bg3);display:inline-block}
.fvs{width:18px;height:13px;border-radius:2px;object-fit:cover;flex-shrink:0;vertical-align:middle;background:var(--bg3);display:inline-block}
.fv-none{display:inline-flex;align-items:center;justify-content:center;width:21px;height:15px;border-radius:2px;background:var(--bg3);font-size:8px;color:var(--text3);font-weight:700;flex-shrink:0;vertical-align:middle}

.res-fin{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:rgba(201,162,39,.15);color:var(--gold);border:1px solid rgba(201,162,39,.3)}
.res-live{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:rgba(231,76,60,.15);color:var(--red);border:1px solid rgba(231,76,60,.3);animation:pulse .8s infinite}
.res-auto{font-size:9px;padding:1px 5px;border-radius:3px;background:rgba(46,204,113,.12);color:var(--green);border:1px solid rgba(46,204,113,.25);margin-left:3px}
.m-pc{display:flex;justify-content:center}
.pb{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:4px 9px;border-radius:20px;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:all .12s;max-width:106px;overflow:hidden}
.pb-e{background:rgba(61,142,240,.14);color:#5ea8f5;border-color:rgba(61,142,240,.35)}
.pb-c{background:rgba(224,92,48,.14);color:#f07850;border-color:rgba(224,92,48,.35)}
.pb-mt{color:var(--text3);border:1px dashed var(--border2)}
.pb-mt:hover{border-color:var(--text2);color:var(--text2)}
.pb.correct{box-shadow:0 0 0 1.5px var(--green)!important}
.pb.wrong{opacity:.38}
.exp-panel{border-top:1px solid var(--border);display:none}
.match-card.expanded .exp-panel{display:block}
.exp-inner{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
@media(max-width:580px){.exp-inner{grid-template-columns:1fr}}
.exp-col{background:var(--bg2);padding:12px 14px}
.exp-lbl{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot-e{width:6px;height:6px;border-radius:50%;background:var(--ace);flex-shrink:0}
.dot-c{width:6px;height:6px;border-radius:50%;background:var(--acec);flex-shrink:0}
.exp-ta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;font-family:inherit;padding:8px 10px;resize:vertical;outline:none;min-height:58px;line-height:1.5;-webkit-appearance:none}
.exp-ta:focus{border-color:var(--border2)}
.exp-ta::placeholder{color:var(--text3)}
.po-lbl{font-size:11px;color:var(--text3);margin:8px 0 5px}
.po-wrap{display:flex;gap:5px;flex-wrap:wrap}
.po{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:all .12s}
.po:hover{border-color:var(--text2);color:var(--text)}
.po.se{background:rgba(61,142,240,.15);color:#5ea8f5;border-color:rgba(61,142,240,.4);font-weight:600}
.po.sc{background:rgba(224,92,48,.15);color:#f07850;border-color:rgba(224,92,48,.4);font-weight:600}
.res-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res-lbl{font-size:11px;color:var(--text3)}
.res-inp{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--gold);font-size:13px;font-weight:700;font-family:inherit;padding:5px 9px;outline:none;width:70px;text-align:center;-webkit-appearance:none}
.res-inp:focus{border-color:var(--gold)}
.res-inp::placeholder{color:var(--text3);font-weight:400;font-size:12px}
.save-btn{font-size:12px;padding:5px 14px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.save-btn:hover{background:var(--gold);border-color:var(--gold);color:#0d0f14;font-weight:600}
.save-btn:active{transform:scale(.97)}
.save-ok{font-size:11px;color:var(--green);opacity:0;transition:opacity .3s;white-space:nowrap}
.auto-res{font-size:11px;color:var(--green);display:flex;align-items:center;gap:5px;margin-top:6px}
.gpill{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.st{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.sv{font-size:24px;font-weight:700;line-height:1}
.sv.g{color:var(--gold)}.sv.b{color:var(--ace)}.sv.c{color:var(--acec)}.sv.gr{color:var(--green)}
.sl{font-size:11px;color:var(--text2);margin-top:3px}
.sec{font-size:13px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:22px}
.ds{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.dn{font-size:11px;font-weight:600;letter-spacing:.04em;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.dn.e{color:var(--ace)}.dn.c{color:var(--acec)}
.dsc{font-size:30px;font-weight:700;line-height:1}
.dsc.e{color:var(--ace)}.dsc.c{color:var(--acec)}
.dss{font-size:10px;color:var(--text3);margin-top:3px}
.dvs{font-size:15px;font-weight:700;color:var(--text3);text-align:center}
.br{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bl{font-size:12px;color:var(--text2);width:110px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;justify-content:flex-end;gap:5px}
.bt{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.bf{height:100%;border-radius:3px;transition:width .5s ease}
.bv{font-size:11px;color:var(--text3);width:18px;text-align:right}
.ht{width:100%;border-collapse:collapse;font-size:12px}
.ht th{font-size:10px;font-weight:600;color:var(--text3);text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);letter-spacing:.04em;text-transform:uppercase}
.ht td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
.ht tr:last-child td{border-bottom:none}
.ht tr:hover td{background:var(--bg3)}
.bc{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:700}
.bc.ok{background:rgba(46,204,113,.15);color:var(--green)}
.bc.no{background:rgba(231,76,60,.12);color:var(--red)}
.bc.nd{background:var(--bg3);color:var(--text3)}
.empty{text-align:center;padding:48px 16px;color:var(--text3);font-size:13px;line-height:2}
.nores{text-align:center;padding:32px;color:var(--text3)}
.gtable-wrap{margin-bottom:8px}
.gtable{width:100%;border-collapse:collapse;font-size:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.gtable th{font-size:10px;font-weight:600;color:var(--text3);text-align:center;padding:7px 6px;border-bottom:1px solid var(--border);letter-spacing:.03em;background:var(--bg3)}
.gtable th:nth-child(2){text-align:left}
.gtable td{padding:7px 6px;border-bottom:1px solid var(--border);color:var(--text2);text-align:center;vertical-align:middle}
.gtable td:nth-child(2){text-align:left}
.gtable tr:last-child td{border-bottom:none}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">WC 2026 <span>ESPRIT×CLOUN</span></div>
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchPage('schedule',this)">Расписание</div>
    <div class="nav-tab" onclick="switchPage('analytics',this)">Аналитика</div>
  </div>
  <div class="nav-right">
    <div class="sync-dot" id="syncDot"></div>
    <span class="sync-lbl" id="syncLbl">...</span>
  </div>
</nav>

<div class="set-bar" id="setBar" style="display:none">
  <div class="api-dot" id="apiDot"></div>
  <span id="apiLbl">авто-результаты</span>
  <button class="btn-xs" id="autoBtn" onclick="toggleAuto()">Авто: выкл</button>

  <span style="margin-left:auto">
    <span class="set-link" onclick="document.getElementById('setBar').style.display='none'">скрыть ✕</span>

</div>

<script>

// Флаг как <img> с flagcdn. Для "Ничья" — спец-иконка.
function fv(t){
  if(t==="Ничья") return '<span class="fv-none">=</span>';
  var iso=ISO[t];
  if(!iso) return '<span class="fv-none">'+(t||"?").slice(0,2).toUpperCase()+'</span>';
  return '<img class="fv" src="https://flagcdn.com/'+iso+'.svg" alt="'+t+'" loading="lazy">';
}
function fvs(t){
  if(t==="Ничья") return '<span class="fv-none" style="width:18px;height:13px">=</span>';
  var iso=ISO[t];
  if(!iso) return '<span class="fv-none" style="width:18px;height:13px">'+(t||"?").slice(0,2).toUpperCase()+'</span>';
  return '<img class="fvs" src="https://flagcdn.com/'+iso+'.svg" alt="'+t+'" loading="lazy">';
}

// ═══════════════════════════════════════════════════

      if(v){ results=v; saveLocal(); sr(); }
    });
    fbRoot.child("autoRes").on("value",function(snap){
      var v=snap.val();
      if(v){ autoRes=v; saveLocal(); sr(); }
    });

    // Статус подключения
    fbDB.ref(".info/connected").on("value",function(snap){
      if(snap.val()===true) ss("online","синхронизировано");
      else ss("error","нет связи");
    });
    ss("syncing","подключение...");
  }catch(e){
    ss("error","локально");
    console.log("Firebase init error:",e);
  }
}

function ss(s,l){document.getElementById("syncDot").className="sync-dot "+s;document.getElementById("syncLbl").textContent=l;}

// Запись: в Firebase + локально (локальное как кэш)
function fw(mid,who,val){
  var c=Object.assign({},picks[mid]||{}); c[who]=val; picks[mid]=c;
  saveLocal();
  if(fbReady){ try{ fbRoot.child("picks/"+mid).set(c); }catch(e){} }
  fs();
}
function fc(mid,who,val){

  saveLocal();
  if(fbReady){ try{ fbRoot.child("comments/"+mid).set(c); }catch(e){} }
}
function fr(mid,val){
  results[mid]=val; saveLocal();
  if(fbReady){ try{ fbRoot.child("results/"+mid).set(val); }catch(e){} }
  fs();
}
function far(mid,val){
  autoRes[mid]=val; saveLocal();
  if(fbReady){ try{ fbRoot.child("autoRes/"+mid).set(val); }catch(e){} }
}
function fs(){ ss("syncing","сохранение..."); setTimeout(function(){ ss("online","сохранено"); },700); }

function toggleAuto(){
  autoOn=!autoOn;
  var btn=document.getElementById("autoBtn");
  var cdEl=document.getElementById("cdn");
  if(autoOn){ btn.textContent="Авто: вкл"; btn.className="btn-xs on"; cdEl.style.display=""; runFetch(); }
  else { btn.textContent="Авто: выкл"; btn.className="btn-xs"; cdEl.style.display="none"; clearTimeout(autoTimer); clearInterval(cdTimer); }
}
function runFetch(){
  fetchFixtures();
  cdSec=60; clearInterval(cdTimer);
  cdTimer=setInterval(function(){ cdSec--; document.getElementById("cdn").textContent="обновление через "+cdSec+"с"; if(cdSec<=0){clearInterval(cdTimer);if(autoOn)runFetch();} },1000);
}
function fetchFixtures(){
  var today=new Date().toISOString().slice(0,10);
  setApiS("check","запрос...");
  fetch(API_BASE+"/fixtures?league="+WC_LEAGUE+"&season="+WC_SEASON+"&date="+today,{
    headers:{"x-rapidapi-host":API_HOST,"x-rapidapi-key":API_KEY}
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.errors&&(d.errors.token||d.errors.key)){ setApiS("err","ошибка ключа"); return; }
    var n=processFix(d.response||[]);
    setApiS("ok","обновлено ("+n+" матчей)");
    sr();
  })
  .catch(function(e){ setApiS("err","сеть: "+e.message); });
}
function setApiS(s,l){ document.getElementById("apiDot").className="api-dot "+s; document.getElementById("apiLbl").textContent="авто-результаты: "+l; }
function processFix(fixtures){
  var cnt=0;
  fixtures.forEach(function(fx){
    var st=fx.fixture.status.short;
    var homeEn=fx.teams.home.name, awayEn=fx.teams.away.name;
    var homeRu=EN2RU[homeEn]||homeEn, awayRu=EN2RU[awayEn]||awayEn;
    var g1=fx.goals.home, g2=fx.goals.away;
    if(g1==null||g2==null) return;
    var isLive=["1H","HT","2H","ET","BT","P","LIVE"].indexOf(st)>=0;
    var isFin=["FT","AET","PEN"].indexOf(st)>=0;
    if(!isLive&&!isFin) return;
    var m=MATCHES.find(function(x){ return (x.home===homeRu&&x.away===awayRu)||(x.home===homeEn&&x.away===awayEn); });
    if(!m) return;
    var val=g1+":"+g2+"|"+(isFin?"FT":"LIVE");
    if(autoRes[m.id]!==val){ far(m.id,val); cnt++; }
  });
  return cnt;
}

// UTILS

function pad(n){return n<10?"0"+n:String(n);}
function tz(h,m,off){var hh=h+off;if(hh<0)hh+=24;if(hh>=24)hh-=24;return pad(hh)+":"+pad(m);}
function fd(ds,h,m){return new Date(ds+"T"+pad(h)+":"+pad(m)+":00Z").toLocaleDateString("ru-RU",{month:"short",day:"numeric"});}
function fw2(ds,h,m){return new Date(ds+"T"+pad(h)+":"+pad(m)+":00Z").toLocaleDateString("ru-RU",{weekday:"short"});}
function winner(res,h,a){
  if(!res)return null;
  var s=res.split("|")[0].trim().split(/[:\-]/);
  if(s.length<2)return null;
  var g1=parseInt(s[0]),g2=parseInt(s[1]);
  if(isNaN(g1)||isNaN(g2))return null;
  if(g1>g2)return h;if(g2>g1)return a;return"Ничья";
}
function getBR(mid){
  var man=results[mid]||"";if(man)return{score:man,auto:false,live:false};
  var au=autoRes[mid]||"";if(!au)return null;
  var p=au.split("|");return{score:p[0],auto:true,live:p[1]==="LIVE"};
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

var _rt;

function renderFilters(){
  var html=FILTERS.map(function(f){return'<button class="flt'+(activeFilter===f.key?" active":"")+'" onclick="setF(\''+f.key+'\')">'+f.label+'</button>';}).join("")+
    '<input class="search-box" id="searchBox" placeholder="Поиск..." value="'+esc(searchQ)+'">';
  document.getElementById("filtersRow").innerHTML=html;
  // под-фильтр групп (только когда выбран групповой этап или Все)
  var grpRow=document.getElementById("groupRow");
  if(activeFilter==="group"){
    grpRow.style.display="flex";
    grpRow.innerHTML='<button class="flt'+(activeGroup===""?" active":"")+'" onclick="setG(\'\')">Все группы</button>'+
      GROUP_KEYS.map(function(g){return'<button class="flt'+(activeGroup===g?" active":"")+'" onclick="setG(\''+g+'\')">Группа '+g+'</button>';}).join("");
  } else {
    grpRow.style.display="none";
  }
  var sb=document.getElementById("searchBox");
  if(sb){ sb.oninput=function(){ searchQ=this.value.toLowerCase(); renderSchedOnly(); }; }
}
function setF(k){activeFilter=k;activeGroup="";render();}
function setG(g){activeGroup=g;render();}

// Рендер только списка матчей (не трогаем фильтры — поиск не теряет фокус)
function renderSchedOnly(){
  var root=document.getElementById("schedRoot");
  var ms=MATCHES.filter(function(m){return activeFilter==="all"||m.stage===activeFilter;});
  if(activeFilter==="group"&&activeGroup) ms=ms.filter(function(m){return m.group===activeGroup;});
  if(searchQ)ms=ms.filter(function(m){return m.home.toLowerCase().includes(searchQ)||m.away.toLowerCase().includes(searchQ);});
  if(!ms.length){root.innerHTML='<div class="nores">Матчи не найдены</div>';return;}
  var html="";
  // Если фильтр = группы и выбрана конкретная — показываем таблицу группы сверху
  if(activeFilter==="group"&&activeGroup){
    html+=renderGroupTable(activeGroup);
  }
  var byStage={};STAGE_ORDER.forEach(function(s){byStage[s]=[];});
  ms.forEach(function(m){if(byStage[m.stage])byStage[m.stage].push(m);});
  STAGE_ORDER.forEach(function(stage){
    var list=byStage[stage];if(!list.length)return;
    // в групповом этапе при выборе "Все группы" — разбиваем по группам
    if(stage==="group"&&activeFilter==="group"&&!activeGroup){
      GROUP_KEYS.forEach(function(g){
        var gl=list.filter(function(m){return m.group===g;});
        if(!gl.length)return;
        html+='<div class="stage-sep">Группа '+g+' <span>'+groupTeamsLine(g)+'</span></div>';
        gl.forEach(function(m){html+=renderCard(m);});
      });
    } else {
      html+='<div class="stage-sep">'+STAGE_LABELS[stage]+' <span>'+list.length+' матч'+(list.length===1?"":"ей")+'</span></div>';
      list.forEach(function(m){html+=renderCard(m);});
    }
  });
  root.innerHTML=html;
  applyMob();
}

function groupTeamsLine(g){
  if(!GROUPS[g]) return "";
  return GROUPS[g].join(" · ");
}

// Турнирная таблица группы (на основе сыгранных матчей)
function renderGroupTable(g){
  if(!GROUPS[g]) return "";
  var teams=GROUPS[g];
  var stats={};
  teams.forEach(function(t){ stats[t]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}; });
  MATCHES.filter(function(m){return m.group===g&&m.stage==="group";}).forEach(function(m){
    var br=getBR(m.id);
    if(!br||br.live) return;
    var s=br.score.split(/[:\-]/);
    var g1=parseInt(s[0]),g2=parseInt(s[1]);
    if(isNaN(g1)||isNaN(g2))return;
    if(!stats[m.home]||!stats[m.away])return;
    stats[m.home].p++; stats[m.away].p++;
    stats[m.home].gf+=g1; stats[m.home].ga+=g2;
    stats[m.away].gf+=g2; stats[m.away].ga+=g1;
    if(g1>g2){stats[m.home].w++;stats[m.home].pts+=3;stats[m.away].l++;}
    else if(g2>g1){stats[m.away].w++;stats[m.away].pts+=3;stats[m.home].l++;}
    else {stats[m.home].d++;stats[m.away].d++;stats[m.home].pts++;stats[m.away].pts++;}
  });
  var rows=teams.slice().sort(function(a,b){
    if(stats[b].pts!==stats[a].pts)return stats[b].pts-stats[a].pts;
    return (stats[b].gf-stats[b].ga)-(stats[a].gf-stats[a].ga);
  });
  var anyPlayed=teams.some(function(t){return stats[t].p>0;});
  var body=rows.map(function(t,i){
    var s=stats[t];
    var qual=i<2?"style=\"color:var(--green)\"":(i===2?"style=\"color:var(--gold)\"":"");
    return '<tr><td '+qual+'>'+(i+1)+'</td><td style="display:flex;align-items:center;gap:5px">'+fvs(t)+t+'</td>'
      +'<td>'+s.p+'</td><td>'+s.w+'</td><td>'+s.d+'</td><td>'+s.l+'</td>'
      +'<td>'+s.gf+':'+s.ga+'</td><td style="color:var(--gold);font-weight:700">'+s.pts+'</td></tr>';
  }).join("");
  return '<div class="gtable-wrap"><div class="sec" style="margin-bottom:8px">Таблица группы '+g+(anyPlayed?'':' <span style="font-size:11px;color:var(--text3);font-weight:400">— матчи ещё не сыграны</span>')+'</div>'
    +'<table class="gtable"><thead><tr><th>#</th><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>П</th><th>Голы</th><th>О</th></tr></thead>'
    +'<tbody>'+body+'</tbody></table>'
    +'<div style="font-size:10px;color:var(--text3);margin:6px 0 14px"><span style="color:var(--green)">●</span> выход в плей-офф · <span style="color:var(--gold)">●</span> возможен как лучший третий</div></div>';
}

function render(){ renderFilters(); renderSchedOnly(); }

function renderCard(m){
  var vt=tz(m.utcH,m.utcM,-7),mt=tz(m.utcH,m.utcM,+3);
  var ds=fd(m.date,m.utcH,m.utcM),dw=fw2(m.date,m.utcH,m.utcM);
  var pe=(picks[m.id]||{}).esprit||"";
  var pc=(picks[m.id]||{}).cloun||"";
  var br=getBR(m.id);
  var w=br?winner(br.score,m.home,m.away):null;
  var isExp=!!expanded[m.id];
  var comE=(comments[m.id]||{}).esprit||"";
  var comC=(comments[m.id]||{}).cloun||"";
  var teams=[m.home,m.away,"Ничья"];

  var resPill="";
  if(br){
    var cls=br.live?"res-live":"res-fin";
    var autoTag=br.auto?'<span class="res-auto">авто</span>':"";
    resPill='<span class="'+cls+'">'+br.score+'</span>'+autoTag;
  }
  function pbCls(pick,who){
    var b="pb "+(who==="e"?"pb-e":"pb-c");
    if(!pick)return"pb pb-mt";
    if(!w)return b;
    return b+(pick===w?" correct":" wrong");
  }
  function pbLbl(pick,who){
    if(!pick)return who==="e"?"+ ESPRIT":"+ CLOUN";
    return fvs(pick)+'<span>'+pick+'</span>';
  }

  var teamsHtml='<span style="display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap">'
    +fv(m.home)+'<span>'+m.home+'</span>'
    +'<span style="color:var(--text3)">—</span>'
    +fv(m.away)+'<span>'+m.away+'</span>'
    +(resPill?" "+resPill:"")+'</span>';

  var expHtml="";
  if(isExp){
    var manRes=results[m.id]||"";
    var auR=autoRes[m.id]||"";
    var auScore=auR?auR.split("|")[0]:"";
    var auTag=auR?auR.split("|")[1]:"";
    var opts_e=teams.map(function(t){ return'<span class="po'+(pe===t?" se":"")+'" data-pick="'+m.id+'" data-who="esprit" data-team="'+esc(t)+'">'+fvs(t)+t+'</span>'; }).join("");
    var opts_c=teams.map(function(t){ return'<span class="po'+(pc===t?" sc":"")+'" data-pick="'+m.id+'" data-who="cloun" data-team="'+esc(t)+'">'+fvs(t)+t+'</span>'; }).join("");
    expHtml='<div class="exp-panel"><div class="exp-inner">'
      +'<div class="exp-col">'
      +'<div class="exp-lbl"><div class="dot-e"></div>ESPRIT — Ванкувер'+(pe?'&nbsp;<span style="font-size:10px;color:var(--text3)">пик: '+pe+'</span>':"")+'</div>'
      +'<textarea class="exp-ta" placeholder="Комментарий, ощущения, прогноз..." rows="3" oninput="_pcmt['+m.id+']=_pcmt['+m.id+']||{};_pcmt['+m.id+'].esprit=this.value">'+esc(comE)+'</textarea>'
      +'<div class="po-lbl">Пик — кто выиграет:</div><div class="po-wrap">'+opts_e+'</div>'
      +'<div class="res-row"><span class="res-lbl">Счёт вручную:</span>'
      +'<input class="res-inp" placeholder="2:1" value="'+esc(manRes)+'" oninput="_pres['+m.id+']=this.value" onclick="event.stopPropagation()">'
      +'<button class="save-btn" onclick="doSave(event,'+m.id+')">Сохранить</button>'
      +'<span class="save-ok" id="sok_'+m.id+'">✓ сохранено</span></div>'
      +(auScore?'<div class="auto-res">API: <b style="color:var(--gold)">'+auScore+'</b> ('+auTag+')</div>':"")
      +'</div>'
      +'<div class="exp-col">'
      +'<div class="exp-lbl"><div class="dot-c"></div>CLOUN — Москва'+(pc?'&nbsp;<span style="font-size:10px;color:var(--text3)">пик: '+pc+'</span>':"")+'</div>'
      +'<textarea class="exp-ta" placeholder="Что думает CLOUN о матче..." rows="3" oninput="_pcmt['+m.id+']=_pcmt['+m.id+']||{};_pcmt['+m.id+'].cloun=this.value">'+esc(comC)+'</textarea>'
      +'<div class="po-lbl">Пик — кто выиграет:</div><div class="po-wrap">'+opts_c+'</div>'
      +'</div></div></div>';
  }

  return '<div class="match-card'+(isExp?" expanded":"")+'" id="mc_'+m.id+'">'
    +'<div class="match-row" onclick="toggleE('+m.id+')">'

    +'<div class="m-tvk"><div class="m-t-main">'+vt+'</div><div class="m-t-sub">PDT Ванкувер</div></div>'
    +'<div class="m-tms"><div class="m-t-main">'+mt+'</div><div class="m-t-sub">MSK Москва</div></div>'
    +'<div class="m-teams"><div class="m-teams-name">'+teamsHtml+'</div>'
    +'<div class="m-teams-sub">'+m.venue+'</div>'
    +'<div class="m-teams-sub2">'+vt+' PDT · '+mt+' MSK</div></div>'
    +'<div class="m-pc"><span class="'+pbCls(pe,"e")+'" onclick="openE(event,'+m.id+')">'+pbLbl(pe,"e")+'</span></div>'
    +'<div class="m-pc"><span class="'+pbCls(pc,"c")+'" onclick="openE(event,'+m.id+')">'+pbLbl(pc,"c")+'</span></div>'

    +'</div>'+expHtml+'</div>';
}

function doSave(e,mid){
  e.stopPropagation();
  var c=_pcmt[mid];
  if(c){if(c.esprit!==undefined)fc(mid,"esprit",c.esprit);if(c.cloun!==undefined)fc(mid,"cloun",c.cloun);delete _pcmt[mid];}

function renderAn(){
  var root=document.getElementById("anRoot");
  var fin=MATCHES.filter(function(m){var br=getBR(m.id);return br&&!br.live&&winner(br.score,m.home,m.away)!==null;});
  if(!fin.length){root.innerHTML='<div class="empty">Аналитика появится после первых матчей.<br>Введи счёт вручную или включи авто-обновление.</div>';return;}
  var ce=0,cc=0,tw={};
  fin.forEach(function(m){var br=getBR(m.id);var w=winner(br.score,m.home,m.away);if(!w)return;tw[w]=(tw[w]||0)+1;if((picks[m.id]||{}).esprit===w)ce++;if((picks[m.id]||{}).cloun===w)cc++;});
  var pet=fin.filter(function(m){return(picks[m.id]||{}).esprit;}).length;
  var pct2=fin.filter(function(m){return(picks[m.id]||{}).cloun;}).length;
  function pct(n,d){return d?Math.round(n/d*100):0;}
  var top=Object.entries(tw).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
  var mxW=top[0]?top[0][1]:1;
  var autoC=fin.filter(function(m){var br=getBR(m.id);return br&&br.auto;}).length;
  var hist=fin.slice(-25).reverse().map(function(m){
    var br=getBR(m.id);var w=winner(br.score,m.home,m.away);
    var pe=(picks[m.id]||{}).esprit||"",pc=(picks[m.id]||{}).cloun||"";
    var bE=!pe?'<span class="bc nd">—</span>':pe===w?'<span class="bc ok">✓</span>':'<span class="bc no">✗</span>';
    var bC=!pc?'<span class="bc nd">—</span>':pc===w?'<span class="bc ok">✓</span>':'<span class="bc no">✗</span>';
    var at=br.auto?'<span class="res-auto">авто</span>':"";
    return'<tr><td>'+fd(m.date,m.utcH,m.utcM)+'</td>'
      +'<td><span style="display:inline-flex;align-items:center;gap:4px">'+fvs(m.home)+m.home+' — '+fvs(m.away)+m.away+'</span></td>'
      +'<td style="color:var(--gold);font-weight:700">'+br.score+at+'</td>'
      +'<td><span style="display:inline-flex;align-items:center;gap:4px">'+(pe?fvs(pe)+pe:"—")+" "+bE+'</span></td>'
      +'<td><span style="display:inline-flex;align-items:center;gap:4px">'+(pc?fvs(pc)+pc:"—")+" "+bC+'</span></td></tr>';
  }).join("");
  root.innerHTML=
    '<div class="an-grid">'
    +'<div class="st"><div class="sv g">'+fin.length+'</div><div class="sl">матчей сыграно</div></div>'
    +'<div class="st"><div class="sv gr">'+autoC+'</div><div class="sl">авто-результатов</div></div>'
    +'<div class="st"><div class="sv b">'+ce+"/"+pet+'</div><div class="sl">угаданных — ESPRIT</div></div>'
    +'<div class="st"><div class="sv c">'+cc+"/"+pct2+'</div><div class="sl">угаданных — CLOUN</div></div>'
    +'</div>'
    +'<div class="sec">Счёт угадывания</div><div class="duel">'
    +'<div class="ds"><div class="dn e">ESPRIT</div><div class="dsc e">'+pct(ce,pet)+'<span style="font-size:14px;font-weight:400;color:var(--text2)">%</span></div><div class="dss">'+ce+' из '+pet+' верно</div></div>'
    +'<div class="dvs">VS</div>'
    +'<div class="ds"><div class="dn c">CLOUN</div><div class="dsc c">'+pct(cc,pct2)+'<span style="font-size:14px;font-weight:400;color:var(--text2)">%</span></div><div class="dss">'+cc+' из '+pct2+' верно</div></div>'
    +'</div>'
    +(top.length?'<div class="sec">Победы по командам</div><div style="margin-bottom:22px">'+
      top.map(function(e){return'<div class="br"><div class="bl">'+fvs(e[0])+e[0]+'</div><div class="bt"><div class="bf" style="width:'+Math.round(e[1]/mxW*100)+'%;background:var(--gold)"></div></div><div class="bv">'+e[1]+'</div></div>';}).join("")
    +'</div>':"")
    +'<div class="sec">История матчей</div><div style="overflow-x:auto"><table class="ht">'
    +'<thead><tr><th>Дата</th><th>Матч</th><th>Счёт</th><th>ESPRIT</th><th>CLOUN</th></tr></thead><tbody>'+hist+'</tbody></table></div>';
}

function switchPage(id,el){
  document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active");});
  document.querySelectorAll(".nav-tab").forEach(function(t){t.classList.remove("active");});
  document.getElementById("page-"+id).classList.add("active");
  el.classList.add("active");
  if(id==="analytics")renderAn();
}

// Двойной клик на лого → показать настройки API
document.querySelector(".nav-logo").addEventListener("dblclick",function(){
  var sb=document.getElementById("setBar");
  sb.style.display=sb.style.display==="none"?"flex":"none";
});

// Делегирование кликов по пик-кнопкам (избегаем апострофов в onclick)
document.getElementById("schedRoot").addEventListener("click",function(e){
  var el=e.target.closest("[data-pick]");
  if(!el) return;
  e.stopPropagation();
  var mid=parseInt(el.getAttribute("data-pick"));
  var who=el.getAttribute("data-who");
  var team=el.getAttribute("data-team");
  var cur=(picks[mid]||{})[who];
  fw(mid,who,cur===team?"":team);
  expanded[mid]=true;
  renderSchedOnly();
});

initFirebase();

setTimeout(function(){ setApiS("","готово, вкл «Авто» при матче"); },500);
