<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WC 2026 — ESPRIT & CLOUN</title>
<style>
:root{
  --bg:#0d0f14;--bg2:#13161e;--bg3:#1a1e29;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
  --text:#e8eaf0;--text2:#7a8099;--text3:#4a5068;
  --ace:#3d8ef0;--acec:#e05c30;--gold:#c9a227;
  --green:#2ecc71;--red:#e74c3c;--orange:#e8890c;
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}
nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;position:sticky;top:0;z-index:100;min-height:48px}
.nav-logo{font-size:14px;font-weight:700;color:var(--gold);white-space:nowrap;flex-shrink:0}
.nav-logo span{color:var(--text2);font-weight:400}
.nav-tabs{display:flex;margin-left:10px}
.nav-tab{padding:12px 12px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--text);border-bottom-color:var(--gold)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0}
.sync-dot.online{background:var(--green)}
.sync-dot.syncing{background:var(--gold);animation:pulse .8s infinite}
.sync-dot.error{background:var(--red)}
.sync-lbl{font-size:11px;color:var(--text2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* SETTINGS PANEL */
.set-bar{background:var(--bg3);border-bottom:1px solid var(--border);padding:7px 16px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3);flex-wrap:wrap}
.api-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0}
.api-dot.ok{background:var(--green)}
.api-dot.err{background:var(--red)}
.api-dot.check{background:var(--orange);animation:pulse .8s infinite}
.btn-xs{font-size:11px;padding:3px 10px;border-radius:var(--rs);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-xs:hover{background:var(--bg2);color:var(--text)}
.btn-xs.on{background:var(--green);border-color:var(--green);color:#0d0f14;font-weight:600}
.cdn{font-variant-numeric:tabular-nums;color:var(--text3)}
.set-link{color:var(--ace);text-decoration:none;cursor:pointer}

.page{display:none;padding:12px 16px;max-width:920px;margin:0 auto}
.page.active{display:block}
.filters-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.flt{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.flt:hover{border-color:var(--text2);color:var(--text)}
.flt.active{background:var(--gold);border-color:var(--gold);color:#0d0f14;font-weight:600}
.search-box{margin-left:auto;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-size:12px;outline:none;width:130px}
.search-box:focus{border-color:var(--text2)}
.stage-sep{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:16px 0 6px;border-bottom:1px solid var(--border);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.stage-sep span{color:var(--text2);font-size:10px;font-weight:400;letter-spacing:0;text-transform:none}
.match-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:4px;overflow:hidden;transition:border-color .15s}
.match-card.expanded{border-color:var(--border2)}
.match-card:hover{border-color:var(--border2)}
.match-row{display:grid;grid-template-columns:24px 94px 78px 1fr 108px 108px;align-items:center;padding:10px 12px;cursor:pointer;gap:6px;user-select:none}
@media(max-width:640px){
  .match-row{grid-template-columns:1fr auto;grid-template-rows:auto auto;padding:10px 12px;gap:3px 8px}
  .m-num,.m-tvk,.m-tms,.m-pc{display:none}
  .m-teams{grid-column:1;grid-row:1}
  .m-date{grid-column:2;grid-row:1;text-align:right}
  .m-mob{display:flex}
  /* при раскрытии карточки прячем мобильный ряд (пики есть внутри панели) */
  .match-card.expanded .m-mob{display:none}
  /* ── mobile top nav: keep everything on one line ── */
  nav{padding:0 10px;min-height:46px;gap:2px}
  .nav-logo{font-size:13px}
  .nav-logo span{display:none}            /* hide "ESPRIT×CLOUN" subtitle */
  .nav-tabs{margin-left:6px;gap:0}
  .nav-tab{padding:12px 9px;font-size:12.5px}
  .nav-right{gap:5px}
  .sync-lbl{display:none}                 /* keep only the colored status dot */
}
@media(max-width:360px){
  .nav-tab{padding:12px 7px;font-size:12px}
  .nav-logo{font-size:12px}
}
@media(min-width:641px){
  .m-mob{display:none!important}
}
.m-mob{display:none;grid-column:1/-1;grid-row:2;gap:7px}
.m-num{font-size:10px;color:var(--text3);text-align:center}
.m-date-main{font-size:12px;font-weight:500;white-space:nowrap}
.m-date-sub{font-size:10px;color:var(--text2)}
.m-t-main{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.m-t-sub{font-size:10px;color:var(--text3)}
.m-teams-name{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:13px;font-weight:500}
.m-teams-sub{font-size:10px;color:var(--text2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-teams-sub2{font-size:10px;color:var(--text3);margin-top:1px}

/* FLAG — real SVG images from flagcdn */
.fv{width:21px;height:15px;border-radius:2px;object-fit:cover;flex-shrink:0;vertical-align:middle;background:var(--bg3);display:inline-block}
.fvs{width:18px;height:13px;border-radius:2px;object-fit:cover;flex-shrink:0;vertical-align:middle;background:var(--bg3);display:inline-block}
.fv-none{display:inline-flex;align-items:center;justify-content:center;width:21px;height:15px;border-radius:2px;background:var(--bg3);font-size:8px;color:var(--text3);font-weight:700;flex-shrink:0;vertical-align:middle}

.res-fin{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:rgba(201,162,39,.15);color:var(--gold);border:1px solid rgba(201,162,39,.3)}
.res-live{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:rgba(231,76,60,.15);color:var(--red);border:1px solid rgba(231,76,60,.3);animation:pulse .8s infinite}
.res-auto{font-size:9px;padding:1px 5px;border-radius:3px;background:rgba(46,204,113,.12);color:var(--green);border:1px solid rgba(46,204,113,.25);margin-left:3px}
.m-pc{display:flex;justify-content:center}
.pb{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:4px 9px;border-radius:20px;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:all .12s;max-width:106px;overflow:hidden}
.pb-e{background:rgba(61,142,240,.14);color:#5ea8f5;border-color:rgba(61,142,240,.35)}
.pb-c{background:rgba(224,92,48,.14);color:#f07850;border-color:rgba(224,92,48,.35)}
.pb-mt{color:var(--text3);border:1px dashed var(--border2)}
.pb-lock{opacity:.5;cursor:default}
.po-lock{cursor:default;opacity:.85}
.po-lock:hover{border-color:var(--border2)}
.mstatus{font-size:9px;font-weight:800;letter-spacing:.05em;padding:1px 6px;border-radius:4px;margin-left:7px;vertical-align:middle}
.mstatus.live{background:rgba(224,64,46,.18);color:#ff7a5c;animation:pulse 1s infinite}
.mstatus.fin{background:var(--bg3);color:var(--text3)}
.lock-note{font-size:11px;color:var(--text2);background:var(--bg3);padding:7px 14px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border)}
.match-card.locked{opacity:.96}
.you-tag{font-size:8px;font-weight:800;letter-spacing:.05em;padding:1px 5px;border-radius:3px;background:var(--gold);color:#0a0c11;margin-left:5px;vertical-align:middle}
/* multi-user single-column expand */
.exp-single{padding:14px 16px}
.m-pc-wide{min-width:120px;display:flex;justify-content:flex-end}
.mkt-hidden{font-size:12px;color:var(--text2);background:var(--bg3);border-radius:var(--rs);padding:10px 14px;margin:12px 0}
.mkt{margin:14px 0;background:var(--bg3);border-radius:var(--rs);padding:12px 14px}
.mkt-h{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:9px}
.mkt-row{display:flex;align-items:center;gap:9px;padding:4px 0}
.mkt-row.win .mkt-name{color:var(--green);font-weight:700}
.mkt-name{font-size:12.5px;min-width:110px;display:flex;align-items:center;gap:5px}
.mkt-bar{flex:1;height:7px;background:var(--bg2);border-radius:4px;overflow:hidden}
.mkt-fill{display:block;height:100%;border-radius:4px;transition:width .4s}
.mkt-pct{font-size:11px;color:var(--text2);width:34px;text-align:right;font-weight:600}
.mkt-odds{font-size:11px;color:var(--gold2);width:46px;text-align:right;font-weight:700;font-family:var(--serif,'Georgia',serif)}
.mkt-mine{margin-top:10px;font-size:12.5px;padding:8px 12px;border-radius:var(--rs)}
.mkt-mine.pos{background:rgba(80,200,120,.12);color:var(--green)}
.mkt-mine.neg{background:rgba(224,64,46,.10);color:#ff7a5c}
/* leaderboard */
table.lb{width:100%;border-collapse:collapse;font-size:13px}
table.lb th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);font-weight:700;padding:7px 9px;border-bottom:1px solid var(--border)}
table.lb td{padding:9px;border-bottom:1px solid var(--border)}
table.lb tr.lb-me{background:rgba(212,175,55,.08)}
.lb-rank{font-size:15px;width:34px;text-align:center}
.lb-name{font-weight:600}
.lb-pts{color:var(--gold2);font-weight:800;font-family:var(--serif,'Georgia',serif)}
.pb-mt:hover{border-color:var(--text2);color:var(--text2)}
.pb.correct{box-shadow:0 0 0 1.5px var(--green)!important}
.pb.wrong{opacity:.38}
.exp-panel{border-top:1px solid var(--border);display:none}
.match-card.expanded .exp-panel{display:block}
.exp-inner{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
@media(max-width:580px){.exp-inner{grid-template-columns:1fr}}
.exp-col{background:var(--bg2);padding:12px 14px}
.exp-lbl{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot-e{width:6px;height:6px;border-radius:50%;background:var(--ace);flex-shrink:0}
.dot-c{width:6px;height:6px;border-radius:50%;background:var(--acec);flex-shrink:0}
.exp-ta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;font-family:inherit;padding:8px 10px;resize:vertical;outline:none;min-height:58px;line-height:1.5;-webkit-appearance:none}
.exp-ta:focus{border-color:var(--border2)}
.exp-ta::placeholder{color:var(--text3)}
.po-lbl{font-size:11px;color:var(--text3);margin:8px 0 5px}
.po-wrap{display:flex;gap:5px;flex-wrap:wrap}
.po{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:all .12s}
.po:hover{border-color:var(--text2);color:var(--text)}
.po.se{background:rgba(61,142,240,.15);color:#5ea8f5;border-color:rgba(61,142,240,.4);font-weight:600}
.po.sc{background:rgba(224,92,48,.15);color:#f07850;border-color:rgba(224,92,48,.4);font-weight:600}
.res-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res-lbl{font-size:11px;color:var(--text3)}
.res-inp{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--gold);font-size:13px;font-weight:700;font-family:inherit;padding:5px 9px;outline:none;width:70px;text-align:center;-webkit-appearance:none}
.res-inp:focus{border-color:var(--gold)}
.res-inp::placeholder{color:var(--text3);font-weight:400;font-size:12px}
.save-btn{font-size:12px;padding:5px 14px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.save-btn:hover{background:var(--gold);border-color:var(--gold);color:#0d0f14;font-weight:600}
.save-btn:active{transform:scale(.97)}
.save-ok{font-size:11px;color:var(--green);opacity:0;transition:opacity .3s;white-space:nowrap}
.auto-res{font-size:11px;color:var(--green);display:flex;align-items:center;gap:5px;margin-top:6px}
.res-pending{font-size:11px;color:var(--text3);margin-top:10px;font-style:italic}
.lineup-sec{grid-column:1/-1;background:var(--bg2);padding:14px 18px;border-top:1px solid var(--border)}
.lineup-btn{font-size:12.5px;padding:9px 18px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.lineup-btn:hover{background:var(--gold);border-color:var(--gold);color:#0a0c11}
.lu-loading{display:flex;align-items:center;gap:10px;color:var(--text3);font-size:12.5px;padding:8px 0}
.lu-spin{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:lspin .8s linear infinite}
@keyframes lspin{to{transform:rotate(360deg)}}
.lu-empty,.lu-empty-sm{color:var(--text3);font-size:12px;line-height:1.6;padding:6px 0}
.lu-empty-sm{font-size:11px;opacity:.7}
.lu-wrap{margin-top:2px}
.lu-title{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.lu-refresh{font-size:10px;color:var(--text3);cursor:pointer;font-weight:500;text-transform:none;letter-spacing:0}
.lu-refresh:hover{color:var(--gold2)}
.lu-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:600px){.lu-cols{grid-template-columns:1fr;gap:14px}}
.lu-team{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.lu-form{margin-left:auto;font-size:10px;color:var(--text3);background:var(--bg3);padding:2px 7px;border-radius:4px;font-weight:600}
.lu-list{display:flex;flex-direction:column;gap:1px}
.lu-p{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:5px}
.lu-p:hover{background:var(--bg3)}
.lu-num{font-family:var(--serif,'Georgia',serif);font-size:12px;font-weight:700;color:var(--gold2);width:20px;text-align:center;flex-shrink:0}
.lu-name{font-size:12.5px;color:var(--text)}
.lu-pos{margin-left:auto;font-size:9.5px;color:var(--text3);font-weight:600}
.lu-p .lu-pos+.lu-rate{margin-left:8px}
.lu-p:has(.lu-pos) .lu-rate{margin-left:8px}
.lu-sub-h{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin:11px 0 5px}
.lu-bench .lu-name{font-size:11.5px;color:var(--text2)}
.lu-note{font-size:11px;color:var(--text3);margin-bottom:10px;font-style:italic}
.lu-cap{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:3px;background:var(--gold);color:#0a0c11;font-size:8px;font-weight:800;margin-left:5px;vertical-align:middle}
.lu-ev{font-size:10px;margin-left:4px}
.lu-yc{display:inline-block;width:7px;height:10px;border-radius:1px;background:#f0c020;margin-left:4px;vertical-align:middle}
.lu-rc{display:inline-block;width:7px;height:10px;border-radius:1px;background:#e0402e;margin-left:4px;vertical-align:middle}
.lu-rate{margin-left:auto;font-size:10px;font-weight:700;color:var(--gold2);background:var(--bg3);padding:1px 5px;border-radius:3px}
.lu-coach{font-size:11px;color:var(--text2);margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.lu-coach b{color:var(--text)}
.lu-unav{font-size:11px;color:var(--text3);padding:2px 0}
.lu-unav span{opacity:.7;font-style:italic}
.gpill{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.st{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.sv{font-size:24px;font-weight:700;line-height:1}
.sv.g{color:var(--gold)}.sv.b{color:var(--ace)}.sv.c{color:var(--acec)}.sv.gr{color:var(--green)}
.sl{font-size:11px;color:var(--text2);margin-top:3px}
.sec{font-size:13px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:22px}
.ds{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.dn{font-size:11px;font-weight:600;letter-spacing:.04em;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.dn.e{color:var(--ace)}.dn.c{color:var(--acec)}
.dsc{font-size:30px;font-weight:700;line-height:1}
.dsc.e{color:var(--ace)}.dsc.c{color:var(--acec)}
.dss{font-size:10px;color:var(--text3);margin-top:3px}
.dvs{font-size:15px;font-weight:700;color:var(--text3);text-align:center}
.br{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bl{font-size:12px;color:var(--text2);width:110px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;justify-content:flex-end;gap:5px}
.bt{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.bf{height:100%;border-radius:3px;transition:width .5s ease}
.bv{font-size:11px;color:var(--text3);width:18px;text-align:right}
.ht{width:100%;border-collapse:collapse;font-size:12px}
.ht th{font-size:10px;font-weight:600;color:var(--text3);text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);letter-spacing:.04em;text-transform:uppercase}
.ht td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
.ht tr:last-child td{border-bottom:none}
.ht tr:hover td{background:var(--bg3)}
.bc{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:700}
.bc.ok{background:rgba(46,204,113,.15);color:var(--green)}
.bc.no{background:rgba(231,76,60,.12);color:var(--red)}
.bc.nd{background:var(--bg3);color:var(--text3)}
.empty{text-align:center;padding:48px 16px;color:var(--text3);font-size:13px;line-height:2}
.nores{text-align:center;padding:32px;color:var(--text3)}
.city-hero{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;font-size:15px;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap}
.set-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:8px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);gap:12px}
.set-row:last-of-type{border-bottom:none}
.set-k{font-size:12px;color:var(--text2)}
.set-v{font-size:13px;color:var(--text);text-align:right}
.set-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;font-family:inherit;padding:8px 10px;outline:none;margin-top:4px;-webkit-appearance:none}
.set-input:focus{border-color:var(--gold)}

// IDENTITY — multi-user. Each Telegram user is a participant.
// myId: stable id (telegram user id, or a generated browser id)
// myName: display name (telegram name/username, or chosen in browser)
// ═══════════════════════════════════════════════════
var myId=null, myName=null, tgUser=null;
function genId(){ return "u_"+Math.random().toString(36).slice(2,10); }
function initTelegram(){
  try{
    var tg=window.Telegram&&window.Telegram.WebApp;
    if(tg){
      tg.ready(); tg.expand();
      tgUser=(tg.initDataUnsafe&&tg.initDataUnsafe.user)||null;
      if(tgUser&&tgUser.id){
        myId="tg_"+tgUser.id;
        myName=(tgUser.username?("@"+tgUser.username):((tgUser.first_name||"")+(tgUser.last_name?(" "+tgUser.last_name):""))).trim()||("Player "+String(tgUser.id).slice(-4));
      }
    }
  }catch(e){}
  // browser fallback: persistent local id + chosen name
  if(!myId){
    myId=localStorage.getItem("wc26_uid");
    if(!myId){ myId=genId(); localStorage.setItem("wc26_uid",myId); }
    myName=localStorage.getItem("wc26_uname")||"";
  }
}
// ask for a name in browser mode (no telegram)
function ensureName(){
  if(myName) return true;
  var n=prompt("Enter your name to join the pool:");
  if(n&&n.trim()){ myName=n.trim().slice(0,24); localStorage.setItem("wc26_uname",myName); registerUser(); return true; }
  return false;
}
function meName(){ return myName||"Guest"; }
function changeName(){
  var n=prompt("Your display name:", myName||"");
  if(n&&n.trim()){ myName=n.trim().slice(0,24); localStorage.setItem("wc26_uname",myName); registerUser(); render(); renderSettings(); }
}

function teamMatch(x, apiName, apiLong){
  return x===apiName || x===apiLong || x===canon(apiName) || x===canon(apiLong);
}

// detects playoff placeholders (1A, 2B, W49, 3ABCDF, L77, TBD)
function isTBA(t){
  if(!t) return true;
  if(ISO[t]) return false;
  if(t==="Draw") return false;
  return true;
}
function teamName(t){
  if(!isTBA(t)) return t;
  return '<span style="color:var(--text3)">TBA</span>';
}
function teamNameFull(t){
  if(!isTBA(t)) return t;
  return '<span style="color:var(--text3)">TBA</span><span style="font-size:10px;color:var(--text3);opacity:.7"> ('+tbaHint(t)+')</span>';
}
function tbaHint(t){
  if(/^1[A-L]$/.test(t)) return "Winner Grp "+t.slice(1);
  if(/^2[A-L]$/.test(t)) return "Runner-up Grp "+t.slice(1);
  if(/^3[A-L]+$/.test(t)) return "Best 3rd";
  if(/^W(\d+)$/.test(t)) return "Winner M"+t.slice(1);
  if(/^L(\d+)$/.test(t)) return "Loser M"+t.slice(1);
  return "TBD";
}

// Flag as <img> from flagcdn. "Draw" → special icon, TBA → question mark.
function fv(t){
  if(t==="Draw") return '<span class="fv-none">=</span>';
  if(isTBA(t)) return '<span class="fv-none">?</span>';
  var iso=ISO[t];
  if(!iso) return '<span class="fv-none">?</span>';
  return '<img class="fv" src="https://flagcdn.com/'+iso+'.svg" alt="'+t+'" loading="lazy">';
}
function fvs(t){
  if(t==="Draw") return '<span class="fv-none" style="width:18px;height:13px">=</span>';
  if(isTBA(t)) return '<span class="fv-none" style="width:18px;height:13px">?</span>';
  var iso=ISO[t];
  if(!iso) return '<span class="fv-none" style="width:18px;height:13px">?</span>';
  return '<img class="fvs" src="https://flagcdn.com/'+iso+'.svg" alt="'+t+'" loading="lazy">';

var lastFetchInfo={time:null,status:"",count:0};

function setApiInfo(s,l){ lastFetchInfo.statusClass=s; lastFetchInfo.statusText=l; }

// Date in YYYYMMDD format (required by free-api-live-football-data)
function fmtDateAPI(d){
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate());
}

function fetchFixtures(manual){
  setApiInfo("check","requesting API...");
  // The API buckets matches by the stadium's LOCAL date, which can be ±1 day from UTC.
  // So we query yesterday, today and tomorrow to be safe.
  var today=new Date();
  var yest=new Date(Date.now()-86400000);
  var tom=new Date(Date.now()+86400000);
  var dates=[fmtDateAPI(yest),fmtDateAPI(today),fmtDateAPI(tom)];
  var done=0, totalNew=0, totalMatched=0, hadError=false, errMsg="";
  lastFetchInfo.debug={dates:dates, totalReturned:0, sampleNames:[], wcCandidates:[]};
  dates.forEach(function(ds){
    fetch(apiCfg.base+"/football-get-matches-by-date?date="+ds,{
      headers:{"x-rapidapi-host":apiCfg.host,"x-rapidapi-key":apiCfg.key}
    })
    .then(function(r){
      if(r.status===401||r.status===403) throw new Error("key not subscribed to this API");
      if(r.status===429) throw new Error("rate limit exceeded");
      return r.json();
    })
    .then(function(d){
      if(d.status&&d.status!=="success"){ hadError=true; errMsg="API returned status: "+d.status; return; }
      var matches=(d.response&&d.response.matches)||[];
      lastFetchInfo.debug.totalReturned+=matches.length;
      // collect team-name pairs that look like our WC teams (for debugging mismatches)
      matches.forEach(function(fx){
        if(!fx.home||!fx.away)return;
        var hn=fx.home.name, an=fx.away.name;
        var isWC = MATCHES.some(function(x){return teamMatch(x.home,hn,fx.home.longName)||teamMatch(x.away,an,fx.away.longName)||teamMatch(x.home,an,fx.away.longName)||teamMatch(x.away,hn,fx.home.longName);});
        if(isWC) lastFetchInfo.debug.wcCandidates.push(hn+" vs "+an);
      });
      if(lastFetchInfo.debug.sampleNames.length<10){
        matches.slice(0,10).forEach(function(fx){ if(fx.home&&fx.away) lastFetchInfo.debug.sampleNames.push(fx.home.name+" vs "+fx.away.name); });
      }
      var res=processFix(matches);
      totalNew+=res.updated; totalMatched+=res.matched;
    })
    .catch(function(e){ hadError=true; errMsg=e.message; })
    .finally(function(){
      done++;
      if(done===dates.length){
        lastFetchInfo.time=new Date();
        if(hadError){ lastFetchInfo.status="err"; setApiInfo("err",errMsg||"error"); }
        else if(totalMatched===0){ lastFetchInfo.status="ok"; setApiInfo("ok","request ok, no WC matches today ("+lastFetchInfo.debug.totalReturned+" total returned)"); }
        else { lastFetchInfo.status="ok"; setApiInfo("ok","WC matches found: "+totalMatched+", updated: "+totalNew); }
        sr(); renderSettings();
      }
    });
  });
}

function processFix(matches){
  var cnt=0, matched=0;
  matches.forEach(function(fx){
    if(!fx.home||!fx.away||!fx.status) return;
    var homeEn=fx.home.name, awayEn=fx.away.name;
    var homeLong=fx.home.longName||homeEn, awayLong=fx.away.longName||awayEn;
    var g1=fx.home.score, g2=fx.away.score;
    if(g1==null||g2==null) return;
    var st=fx.status;
    var isFin=st.finished===true;
    var isLive=st.started===true && !st.finished && !st.cancelled;
    if(st.cancelled) return;
    if(!isLive&&!isFin) return;
    // match against our schedule by team name (with alias support); handle swapped home/away
    var swapped=false;
    var m=MATCHES.find(function(x){
      if(teamMatch(x.home,homeEn,homeLong)&&teamMatch(x.away,awayEn,awayLong)) return true;
      if(teamMatch(x.home,awayEn,awayLong)&&teamMatch(x.away,homeEn,homeLong)){ swapped=true; return true; }
      return false;
    });
    if(!m) return;
    matched++;
    var tag=isFin?(st.reason&&st.reason.short?st.reason.short:"FT"):"LIVE";
    // keep score oriented to OUR home:away ordering
    var sH=swapped?g2:g1, sA=swapped?g1:g2;
    var val=sH+":"+sA+"|"+tag;
    if(autoRes[m.id]!==val){ far(m.id,val); cnt++; }
  });
  return {updated:cnt, matched:matched};
}

function pad(n){return n<10?"0"+n:String(n);}
function tz(h,m,off){var hh=h+off;if(hh<0)hh+=24;if(hh>=24)hh-=24;return pad(hh)+":"+pad(m);}
// Build a Date shifted into the chosen display timezone (as a UTC pseudo-date)
function shifted(ds,h,m){
  var base=new Date(ds+"T"+pad(h)+":"+pad(m)+":00Z");
  return new Date(base.getTime()+tzOff()*3600000);
}
function fd(ds,h,m){var d=shifted(ds,h,m);return d.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});}
function fw2(ds,h,m){var d=shifted(ds,h,m);return d.toLocaleDateString("en-US",{weekday:"short",timeZone:"UTC"});}
// day-key in the chosen timezone for calendar grouping
function dayKey(ds,h,m){var d=shifted(ds,h,m);return d.toISOString().slice(0,10);}
function humanDay(ds,h,m){var d=shifted(ds,h,m);return d.toLocaleDateString("en-US",{day:"numeric",month:"long",weekday:"long",timeZone:"UTC"});}
function winner(res,h,a){
  if(!res)return null;
  var s=res.split("|")[0].trim().split(/[:\-]/);
  if(s.length<2)return null;
  var g1=parseInt(s[0]),g2=parseInt(s[1]);
  if(isNaN(g1)||isNaN(g2))return null;
  if(g1>g2)return h;if(g2>g1)return a;return"Draw";
}
function getBR(mid){
  // Results come ONLY from the API (autoRes). Manual entry is disabled so
  // players can't fake scores to climb the leaderboard.
  var au=autoRes[mid]||"";if(!au)return null;
  var p=au.split("|");return{score:p[0],auto:true,live:p[1]==="LIVE"};
}
// Match kickoff timestamp (UTC ms)
function matchTS(m){ return new Date(m.date+"T"+pad(m.utcH)+":"+pad(m.utcM)+":00Z").getTime(); }
// Are picks locked? Locked once kickoff time has passed, OR a score exists (live/FT).
function isLocked(m){
  if(getBR(m.id)) return true;          // score present (live or finished)
  return Date.now() >= matchTS(m);       // kickoff time reached
}
// Status of a match: "upcoming" | "live" | "finished"
function matchStatus(m){
  var br=getBR(m.id);
  if(br) return br.live?"live":"finished";
  if(Date.now()>=matchTS(m)) return "live";   // started by clock, no score yet
  return "upcoming";
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

      }

    });
    root.innerHTML=html;
    applyMob();

  // Поиск при фильтре "Все" — тоже календарём

      var da=a.date+pad(a.utcH)+pad(a.utcM), db=b.date+pad(b.utcH)+pad(b.utcM);
      return da<db?-1:da>db?1:0;

    list.sort(function(a,b){

function groupTeamsLine(g){
  if(!GROUPS[g]) return "";
  return GROUPS[g].join(" · ");
}

// Турнирная таблица группы (на основе сыгранных матчей)
function renderGroupTable(g){
  if(!GROUPS[g]) return "";
  var teams=GROUPS[g];
  var stats={};
  teams.forEach(function(t){ stats[t]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}; });
  MATCHES.filter(function(m){return m.group===g&&m.stage==="group";}).forEach(function(m){
    var br=getBR(m.id);
    if(!br||br.live) return;
    var s=br.score.split(/[:\-]/);
    var g1=parseInt(s[0]),g2=parseInt(s[1]);
    if(isNaN(g1)||isNaN(g2))return;
    if(!stats[m.home]||!stats[m.away])return;
    stats[m.home].p++; stats[m.away].p++;
    stats[m.home].gf+=g1; stats[m.home].ga+=g2;
    stats[m.away].gf+=g2; stats[m.away].ga+=g1;
    if(g1>g2){stats[m.home].w++;stats[m.home].pts+=3;stats[m.away].l++;}
    else if(g2>g1){stats[m.away].w++;stats[m.away].pts+=3;stats[m.home].l++;}
    else {stats[m.home].d++;stats[m.away].d++;stats[m.home].pts++;stats[m.away].pts++;}
  });
  var rows=teams.slice().sort(function(a,b){
    if(stats[b].pts!==stats[a].pts)return stats[b].pts-stats[a].pts;
    return (stats[b].gf-stats[b].ga)-(stats[a].gf-stats[a].ga);
  });
  var anyPlayed=teams.some(function(t){return stats[t].p>0;});
  var body=rows.map(function(t,i){
    var s=stats[t];
    var qual=i<2?"style=\"color:var(--green)\"":(i===2?"style=\"color:var(--gold)\"":"");
    return '<tr><td '+qual+'>'+(i+1)+'</td><td style="display:flex;align-items:center;gap:5px">'+fvs(t)+t+'</td>'
      +'<td>'+s.p+'</td><td>'+s.w+'</td><td>'+s.d+'</td><td>'+s.l+'</td>'
      +'<td>'+s.gf+':'+s.ga+'</td><td style="color:var(--gold);font-weight:700">'+s.pts+'</td></tr>';
  }).join("");
  return '<div class="gtable-wrap"><div class="sec" style="margin-bottom:8px">Group '+g+' table'+(anyPlayed?'':' <span style="font-size:11px;color:var(--text3);font-weight:400">— no matches played yet</span>')+'</div>'
    +'<table class="gtable"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF:GA</th><th>Pts</th></tr></thead>'
    +'<tbody>'+body+'</tbody></table>'
    +'<div style="font-size:10px;color:var(--text3);margin:6px 0 14px"><span style="color:var(--green)">●</span> advance to knockouts · <span style="color:var(--gold)">●</span> possible best third</div></div>';
}

// crowd breakdown for a match: {counts:{team:n}, total, myPick}
function crowd(m){
  var mp=picks[m.id]||{};
  var counts={}; var total=0; var mine="";
  Object.keys(mp).forEach(function(uid){
    var v=mp[uid]; if(!v) return;
    counts[v]=(counts[v]||0)+1; total++;
    if(uid===myId) mine=v;
  });
  return {counts:counts,total:total,mine:mine};
}
// odds (points) for picking `outcome` given crowd: 1 / share, min share 5%
function oddsFor(cr,outcome){
  if(!cr.total) return 1/0.5; // nobody yet → even
  var share=(cr.counts[outcome]||0)/cr.total;
  if(share<0.05) share=0.05;
  return 1/share;
}
// points THIS user earned on match m (0 if not finished / wrong / no pick)
function matchPoints(m,uid){
  var br=getBR(m.id); if(!br||br.live) return null;
  var w=winner(br.score,m.home,m.away); if(!w) return null;
  var pk=(picks[m.id]||{})[uid]; if(!pk) return 0;
  if(pk!==w) return 0;
  return oddsFor(crowd(m),w);
}

  } else {
    myChip='<span class="pb pb-mt'+(locked?" pb-lock":"")+'">'+(locked?'— no pick':'+ pick')+'</span>';
  }
  var pickClick="toggleE("+m.id+")";

  var expHtml="";
  if(isExp){
    // ── MY PICK selector (3 outcomes) ──
    var outLabel=function(t){ return isTBA(t)?('<span style="color:var(--text3)">'+tbaHint(t)+'</span>'):t; };
    var canPick=!locked;
    var myOpts=teams.map(function(t){
      var sel=(myPick===t)?" se":"";

    } else {
      // revealed: show each outcome share + implied points
      var rows=teams.map(function(t){
        var n=cr.counts[t]||0;
        var share=cr.total?Math.round(n/cr.total*100):0;
        var pts=oddsFor(cr,t);

        return '<div class="mkt-row'+(isWin?" win":"")+'">'
          +'<span class="mkt-name">'+fvs(t)+(isTBA(t)?tbaHint(t):t)+(myPick===t?' <span class="you-tag">YOU</span>':'')+'</span>'
          +'<span class="mkt-bar"><span class="mkt-fill" style="width:'+share+'%;background:'+barColor+'"></span></span>'
          +'<span class="mkt-pct">'+share+'%</span>'

      marketHtml='<div class="mkt"><div class="mkt-h">Room picks ('+cr.total+')</div>'+rows+'</div>';
      // my result line
      var mpts=matchPoints(m,myId);
      if(mpts!==null && myPick){
        marketHtml+='<div class="mkt-mine '+(mpts>0?"pos":"neg")+'">'
          +(mpts>0?('✓ You earned <b>+'+mpts.toFixed(2)+'</b> pts'):'✗ Your pick missed — 0 pts')+'</div>';

    +'<div class="m-pc m-pc-wide">'+myChip+'</div>'
    +'</div>'
    +'<div class="m-mob" id="mob_'+m.id+'" style="padding:0 12px 10px">'
    +'<span class="pb '+(myPick?'pb-e':'pb-mt')+(w&&myPick?(myPick===w?' correct':' wrong'):'')+'" style="flex:1;justify-content:center" onclick="'+pickClick+'">'+(myPick?(fvs(myPick)+'<span>'+(isTBA(myPick)?tbaHint(myPick):myPick)+'</span>'):(locked?'— no pick':'+ tap to pick'))+'</span>'

// LINE-UPS / SQUADS — free-api-live-football-data
// Endpoints: /football-get-hometeam-lineup?eventid=N
//            /football-get-awayteam-lineup?eventid=N
// response.lineup = {name, formation, starters[], subs[], coach, unavailable[]}
// player: name, shirtNumber, usualPlayingPositionId(0GK 1DEF 2MID 3FWD),
//         isCaptain, performance{rating, events[], substitutionEvents[]}
// ═══════════════════════════════════════════════════
var lineupCache={}; // m.id -> {home:{...lineup}, away:{...lineup}}
var POS_NAME={0:"GK",1:"DEF",2:"MID",3:"FWD"};

function loadLineup(e,mid){
  e.stopPropagation();
  var m=MATCHES.find(function(x){return x.id===mid;});
  var body=document.getElementById("lu_"+mid);
  if(!body)return;
  body.innerHTML='<div class="lu-loading"><div class="lu-spin"></div>Loading line-ups…</div>';
  var btn=body.parentNode.querySelector(".lineup-btn"); if(btn)btn.style.display="none";

  // 1) resolve API eventId — the API buckets by stadium LOCAL date which can be ±1
  //    from UTC, so try the scheduled date ±1 AND today/yesterday/tomorrow (real dates).
  var base=new Date(m.date+"T"+pad(m.utcH)+":"+pad(m.utcM)+":00Z");
  var schedD=fmtDateAPI(base);
  var schedNext=fmtDateAPI(new Date(base.getTime()+86400000));
  var schedPrev=fmtDateAPI(new Date(base.getTime()-86400000));
  var realToday=fmtDateAPI(new Date());
  var realYest=fmtDateAPI(new Date(Date.now()-86400000));
  var realTom=fmtDateAPI(new Date(Date.now()+86400000));
  var tryDates=[schedNext,schedD,schedPrev,realTom,realToday,realYest].filter(function(v,i,a){return a.indexOf(v)===i;});

  findEventId(m,tryDates,0,function(fxId){
    if(!fxId){ // not found on any date → fall back to squads
      fetchSquads(m).then(function(sq){
        if(sq){ lineupCache[mid]={squad:sq}; body.innerHTML=renderLineupHTML(m,lineupCache[mid]); }
        else body.innerHTML='<div class="lu-empty">Line-ups aren\'t published yet — they usually appear about an hour before kickoff. Tap ↻ to retry closer to match time.</div>'
          +'<div style="margin-top:8px"><button class="lineup-btn" onclick="refreshLineup(event,'+mid+')">↻ Try again</button></div>';
      });
      return;
    }
    Promise.all([fetchTeamLineup("hometeam",fxId),fetchTeamLineup("awayteam",fxId)])
    .then(function(res){
      var home=res[0], away=res[1];
      if((!home||!home.starters.length)&&(!away||!away.starters.length)){
        return fetchSquads(m).then(function(sq){
          if(sq){ lineupCache[mid]={squad:sq}; body.innerHTML=renderLineupHTML(m,lineupCache[mid]); }
          else body.innerHTML='<div class="lu-empty">Line-ups aren\'t published yet — they usually appear about an hour before kickoff. Tap ↻ to retry closer to match time.</div>'
            +'<div style="margin-top:8px"><button class="lineup-btn" onclick="refreshLineup(event,'+mid+')">↻ Try again</button></div>';
        });
      }
      lineupCache[mid]={home:home,away:away};
      body.innerHTML=renderLineupHTML(m,lineupCache[mid]);
    })
    .catch(function(){
      body.innerHTML='<div class="lu-empty">Couldn\'t load line-ups right now.</div>'
        +'<div style="margin-top:8px"><button class="lineup-btn" onclick="refreshLineup(event,'+mid+')">↻ Try again</button></div>';
    });
  });
}

// recursively try each candidate date until the fixture is found in the API
function findEventId(m,dates,i,cb){
  if(i>=dates.length){ cb(null); return; }
  fetch(apiCfg.base+"/football-get-matches-by-date?date="+dates[i],{
    headers:{"x-rapidapi-host":apiCfg.host,"x-rapidapi-key":apiCfg.key}
  })
  .then(function(r){return r.json();})
  .then(function(d){
    var matches=(d.response&&d.response.matches)||[];
    var fx=matches.find(function(x){
      return x.home&&x.away&&(
        (teamMatch(m.home,x.home.name,x.home.longName)&&teamMatch(m.away,x.away.name,x.away.longName)) ||
        (teamMatch(m.home,x.away.name,x.away.longName)&&teamMatch(m.away,x.home.name,x.home.longName))
      );
    });
    if(fx){ cb(fx.id); } else { findEventId(m,dates,i+1,cb); }
  })
  .catch(function(){ findEventId(m,dates,i+1,cb); });
}

function fetchTeamLineup(side,eventId){
  return fetch(apiCfg.base+"/football-get-"+side+"-lineup?eventid="+eventId,{
    headers:{"x-rapidapi-host":apiCfg.host,"x-rapidapi-key":apiCfg.key}
  }).then(function(r){return r.json();}).then(function(d){
    var L=(d.response&&d.response.lineup)||null;
    if(!L) return {name:"",formation:"",starters:[],subs:[],coach:null};
    var norm=function(p){
      var perf=p.performance||{};
      var ev=(perf.events||[]).map(function(x){return x.type;});
      return {
        name:p.name||((p.firstName||"")+" "+(p.lastName||"")).trim(),
        num:p.shirtNumber||"",
        pos:POS_NAME[p.usualPlayingPositionId]||"",
        cap:!!p.isCaptain,
        rating:perf.rating||null,
        goal:ev.indexOf("goal")>=0,
        yellow:ev.indexOf("yellowCard")>=0,
        red:ev.indexOf("redCard")>=0
      };
    };
    return {
      name:L.name||"", formation:L.formation||"",
      starters:(L.starters||[]).map(norm),
      subs:(L.subs||[]).map(norm),
      coach:L.coach?(L.coach.name||((L.coach.firstName||"")+" "+(L.coach.lastName||"")).trim()):"",
      unavailable:(L.unavailable||[]).map(function(p){return {name:p.name||"", reason:(p.unavailability&&p.unavailability.expectedReturn)||"out"};})
    };
  }).catch(function(){return {name:"",formation:"",starters:[],subs:[],coach:""};});
}

function fetchSquads(m){
  function searchTeam(team){
    return fetch(apiCfg.base+"/football-players-search?search="+encodeURIComponent(team),{
      headers:{"x-rapidapi-host":apiCfg.host,"x-rapidapi-key":apiCfg.key}
    }).then(function(r){return r.json();}).then(function(d){
      var arr=(d.response&&(d.response.suggestions||d.response.players||d.response.list))||[];
      return arr.map(function(x){return {name:x.name||x.longName||x.title||"",num:"",pos:""};}).filter(function(x){return x.name;});
    }).catch(function(){return [];});
  }
  return Promise.all([searchTeam(m.home),searchTeam(m.away)]).then(function(res){
    if(!res[0].length&&!res[1].length) return null;
    return {home:res[0], away:res[1]};
  });
}

function playerRow(p){
  var marks="";
  if(p.cap) marks+='<span class="lu-cap" title="Captain">C</span>';
  if(p.goal) marks+='<span class="lu-ev" title="Goal">⚽</span>';
  if(p.yellow) marks+='<span class="lu-yc" title="Yellow card"></span>';
  if(p.red) marks+='<span class="lu-rc" title="Red card"></span>';
  var rating=p.rating?'<span class="lu-rate">'+p.rating.toFixed(1)+'</span>':"";
  return '<div class="lu-p"><span class="lu-num">'+(p.num||"")+'</span>'
    +'<span class="lu-name">'+esc(p.name)+marks+'</span>'
    +(p.pos?'<span class="lu-pos">'+p.pos+'</span>':"")+rating+'</div>';
}

function renderLineupHTML(m,data){
  // squad fallback shape
  if(data.squad){
    function sqCol(team,arr){
      return '<div class="lu-col"><div class="lu-team">'+fvs(team)+'<b>'+team+'</b></div>'
        +(arr.length?'<div class="lu-list">'+arr.map(function(p){return '<div class="lu-p"><span class="lu-name">'+esc(p.name)+'</span></div>';}).join("")+'</div>'
                    :'<div class="lu-empty-sm">No data</div>')+'</div>';
    }
    return '<div class="lu-wrap"><div class="lu-title">Squads (full roster) <span class="lu-refresh" onclick="refreshLineup(event,'+m.id+')">↻ refresh</span></div>'
      +'<div class="lu-note">Match line-ups not published yet — showing available squads.</div>'
      +'<div class="lu-cols">'+sqCol(m.home,data.squad.home)+sqCol(m.away,data.squad.away)+'</div></div>';
  }
  // full lineup shape
  function col(team,L){
    if(!L) L={starters:[],subs:[],formation:"",coach:"",unavailable:[]};
    var head='<div class="lu-team">'+fvs(team)+'<b>'+team+'</b>'+(L.formation?'<span class="lu-form">'+L.formation+'</span>':"")+'</div>';
    var starters=L.starters.length?'<div class="lu-list">'+L.starters.map(playerRow).join("")+'</div>':'<div class="lu-empty-sm">No starting XI yet</div>';
    var subs=L.subs&&L.subs.length?'<div class="lu-sub-h">Substitutes</div><div class="lu-list lu-bench">'+L.subs.map(playerRow).join("")+'</div>':"";
    var coach=L.coach?'<div class="lu-coach">Coach: <b>'+esc(L.coach)+'</b></div>':"";
    var unav=L.unavailable&&L.unavailable.length?'<div class="lu-sub-h">Unavailable</div>'+L.unavailable.map(function(p){return '<div class="lu-unav">'+esc(p.name)+' <span>'+esc(p.reason)+'</span></div>';}).join(""):"";
    return '<div class="lu-col">'+head+starters+subs+coach+unav+'</div>';
  }
  return '<div class="lu-wrap"><div class="lu-title">Starting line-ups <span class="lu-refresh" onclick="refreshLineup(event,'+m.id+')">↻ refresh</span></div>'
    +'<div class="lu-cols">'+col(m.home,data.home)+col(m.away,data.away)+'</div></div>';
}
function refreshLineup(e,mid){ e.stopPropagation(); delete lineupCache[mid]; loadLineup(e,mid); }


function toggleE(id){expanded[id]=!expanded[id];renderSchedOnly();if(expanded[id])scrollC(id);}
function openE(e,id){e.stopPropagation();expanded[id]=true;renderSchedOnly();scrollC(id);}
function scrollC(id){setTimeout(function(){var el=document.getElementById("mc_"+id);if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});},60);}
// ═══════════════════════════════════════════════════
// ANALYTICS — leaderboard (wisdom-of-crowd points)
// ═══════════════════════════════════════════════════
function renderAn(){
  var root=document.getElementById("anRoot");
  var fin=MATCHES.filter(function(m){var br=getBR(m.id);return br&&!br.live&&winner(br.score,m.home,m.away)!==null;});

  // gather all participant ids: from users map + anyone who has a pick
  var ids={};
  Object.keys(users).forEach(function(u){ids[u]=true;});
  MATCHES.forEach(function(m){ Object.keys(picks[m.id]||{}).forEach(function(u){ids[u]=true;}); });
  var idList=Object.keys(ids);

  function nameOf(uid){ return (users[uid]&&users[uid].name)|| (uid===myId?meName():("Player "+uid.slice(-4))); }

  // per-user stats
  var stats=idList.map(function(uid){
    var pts=0, correct=0, placed=0, total=0;
    MATCHES.forEach(function(m){
      var pk=(picks[m.id]||{})[uid];
      if(pk) total++;
      var p=matchPoints(m,uid);
      if(p===null) return;          // not finished
      if(pk){ placed++; if(p>0){correct++; pts+=p;} }
    });
    return {uid:uid, name:nameOf(uid), pts:pts, correct:correct, placed:placed, total:total};
  }).filter(function(s){return s.total>0;}); // only show people who placed at least one pick

  stats.sort(function(a,b){ return b.pts-a.pts || b.correct-a.correct; });

  if(!stats.length){
    root.innerHTML='<div class="empty">No picks yet.<br>Open a match and place your pick to join the leaderboard.</div>';
    return;
  }

  var myRank=stats.findIndex(function(s){return s.uid===myId;})+1;
  var played=fin.length;

  // leaderboard rows
  var rows=stats.map(function(s,i){
    var isMe=s.uid===myId;
    var medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+"";
    var acc=s.placed?Math.round(s.correct/s.placed*100):0;
    return '<tr'+(isMe?' class="lb-me"':'')+'>'
      +'<td class="lb-rank">'+medal+'</td>'
      +'<td class="lb-name">'+esc(s.name)+(isMe?' <span class="you-tag">YOU</span>':'')+'</td>'
      +'<td class="lb-pts">'+s.pts.toFixed(2)+'</td>'
      +'<td>'+s.correct+'/'+s.placed+'</td>'
      +'<td>'+acc+'%</td>'
      +'<td>'+s.total+'</td>'
      +'</tr>';
  }).join("");

  root.innerHTML=
    '<div class="an-grid">'
    +'<div class="st"><div class="sv g">'+played+'</div><div class="sl">matches settled</div></div>'
    +'<div class="st"><div class="sv gr">'+stats.length+'</div><div class="sl">players</div></div>'
    +'<div class="st"><div class="sv b">'+(myRank||"—")+'</div><div class="sl">your rank</div></div>'
    +'<div class="st"><div class="sv c">'+((stats.find(function(s){return s.uid===myId;})||{}).pts||0).toFixed(1)+'</div><div class="sl">your points</div></div>'
    +'</div>'
    +'<div class="sec">Leaderboard</div>'
    +'<div style="overflow-x:auto"><table class="lb">'
    +'<thead><tr><th>#</th><th>Player</th><th>Points</th><th>Hits</th><th>Acc</th><th>Bets</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>'
    +'<p class="set-hint" style="margin-top:10px">Points use a "wisdom of the crowd" model: a correct pick is worth <b>1 ÷ its share of the room</b> (capped at 20× for picks under 5%). Backing an unpopular outcome that comes true earns far more than backing the favourite. Odds freeze at kickoff.</p>';
}

function switchPage(id,el){
  document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active");});
  document.querySelectorAll(".nav-tab").forEach(function(t){t.classList.remove("active");});
  document.getElementById("page-"+id).classList.add("active");
  el.classList.add("active");
  if(id==="analytics")renderAn();
  if(id==="settings")renderSettings();
}

// Делегирование кликов по кнопкам выбора (data-setpick)
document.getElementById("schedRoot").addEventListener("click",function(e){
  var el=e.target.closest("[data-setpick]");
  if(!el) return;
  e.stopPropagation();
  var mid=parseInt(el.getAttribute("data-setpick"));
  var team=el.getAttribute("data-team");
  var cur=(picks[mid]||{})[myId];
  setPick(mid, cur===team?"":team);
  expanded[mid]=true;
  renderSchedOnly();
});

initTelegram();
render();
setTimeout(applyMob,100);
initFirebase();
renderSettings();

setTimeout(function(){
  if(apiCfg.autoEnabled){
    fetchFixtures();
    clearInterval(autoTimer);
    autoTimer=setInterval(fetchFixtures, FETCH_INTERVAL_MS);
  }
}, 1500);
// re-render schedule every minute so picks lock exactly at kickoff
setInterval(function(){
  if(document.getElementById("page-schedule").classList.contains("active")) renderSchedOnly();
}, 60000);
